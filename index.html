            fallback:"https://cdn.jsdelivr.net/npm/firebase@10.14.1/compat/firebase-auth.js",

            fallback:"https://cdn.jsdelivr.net/npm/firebase@10.14.1/compat/firebase-firestore.js",
            check:()=>window.firebase&&typeof firebase.firestore==="function"
        }
    ];

    function loadScript(url){
        return new Promise((resolve,reject)=>{
            const script=document.createElement("script");
            let finished=false;

            const timeout=setTimeout(()=>{
                if(finished)return;
                finished=true;
                script.remove();
                reject(new Error("Tiempo de espera agotado: "+url));
            },15000);

            script.src=url;
            script.onload=()=>{
                if(finished)return;
                finished=true;
                clearTimeout(timeout);
                resolve();
            };
            script.onerror=()=>{
                if(finished)return;
                finished=true;
                clearTimeout(timeout);
                script.remove();
                reject(new Error("No se pudo cargar: "+url));
            };

            document.head.appendChild(script);
        });
    }

    async function loadLibrary(source){
        try{
            await loadScript(source.primary);
            if(source.check())return;
            throw new Error("La librería principal no quedó disponible.");
        }catch(primaryError){
            await loadScript(source.fallback);
            if(!source.check()){
                throw new Error("La librería alternativa tampoco quedó disponible.");
            }
        }
    }

    async function loadAll(){
        // Primero se carga el núcleo; Auth y Firestore pueden descargarse en paralelo.
        await loadLibrary(sources[0]);
        await Promise.all(sources.slice(1).map(loadLibrary));

        if(!window.firebase)throw new Error("Firebase no está disponible.");
        startGarden();

        console.error("Error cargando Firebase:",error);
        const message=document.createElement("div");

        message.textContent="No se pudieron cargar las librerías de Firebase. Comprueba tu conexión o si el navegador bloquea los servidores de Firebase.";
        document.body.appendChild(message);
    });
})();

function cloneSectionSettings(){
    const copy={};
    Object.keys(sections).forEach(key=>{
        copy[key]=sections[key].map(item=>({...item,hidden:Boolean(item.hidden)}));
    });
    return copy;
}
function applySectionSettings(value){
    if(!value||typeof value!=="object")return;
    Object.keys(sections).forEach(key=>{
        if(!Array.isArray(value[key]))return;
        const removedLegacyCategories=new Set(["reglas","rastros","libro de visitas","libro-visitas"]);
        const clean=value[key].filter(item=>{
                if(!item||typeof item.title!=="string"||!item.title.trim())return false;
                const normalized=item.title.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
                return !removedLegacyCategories.has(normalized);
            })
            .map(item=>({
                title:item.title.trim().slice(0,60),
                description:"",
                hidden:Boolean(item.hidden)
            }));
        if(clean.length)sections[key].splice(0,sections[key].length,...clean);
        // Mantener la categoría Relatos disponible dentro de HOME aunque exista
        // una configuración antigua guardada en Firestore.
        if(key==="HOME"&&!sections[key].some(item=>item.title.toLowerCase()==="relatos")){
            sections[key].push({title:"Relatos",description:""});
        }
    });
}

/* ORDEN PERSONALIZADO */

function hasCustomOrder(item){
    return typeof item.order==="number"&&Number.isFinite(item.order);
}

function compareRecords(a,b){
    if(hasCustomOrder(a)&&hasCustomOrder(b)){
        return a.order-b.order;
    }

    const ta=a.createdAt?.toMillis?.()||0;
    const tb=b.createdAt?.toMillis?.()||0;
    return tb-ta;
}

function sortRecords(items){
    return [...items].sort(compareRecords);
}

async function prepareNextOrder(collectionName,menu,category,excludeId=null){
    const snapshot=await firestore.collection(collectionName)
        .where("menu","==",menu)
        .get();

    const records=[];

    snapshot.forEach(doc=>{
        if(doc.id===excludeId)return;

        const data=doc.data();

        if(data.category===category){
            records.push({id:doc.id,...data});
        }
    });

    const ordered=sortRecords(records);
    const batch=firestore.batch();

    ordered.forEach((item,index)=>{
        batch.update(
            firestore.collection(collectionName).doc(item.id),
            {order:index}
        );
    });

    if(ordered.length){
        await batch.commit();
    }

    return ordered.length;
}

async function moveRecord(collectionName,records,index,direction,reloadFunction){
    const ordered=sortRecords(records);
    const newIndex=index+direction;

    if(newIndex<0||newIndex>=ordered.length)return;

    const first=ordered[index];
    const second=ordered[newIndex];

    if(first.menu!==second.menu||first.category!==second.category)return;

    [ordered[index],ordered[newIndex]]=[ordered[newIndex],ordered[index]];

    const batch=firestore.batch();
    const collection=firestore.collection(collectionName);

    ordered.forEach((item,position)=>{
        batch.update(collection.doc(item.id),{
            order:position
        });
    });

    try{
        await batch.commit();
        await reloadFunction();
    }catch(error){
        console.error("Error cambiando el orden:",error);
        alert("No se pudo guardar el nuevo orden. Comprueba tu conexión e inténtalo de nuevo.");
    }
}

document.getElementById("content-area").addEventListener("click",event=>{
    const anchor=event.target.closest("a");
    if(!anchor)return;

    const rawHref=anchor.getAttribute("href")||"";
    if(!rawHref)return;

    let url;
    try{
        url=new URL(rawHref,location.origin);
    }catch(e){
        return;
    }

    if(url.origin===location.origin){
        const parts=url.pathname.split("/").filter(Boolean).map(p=>{try{return decodeURIComponent(p)}catch(e){return p}});
        if(parts.length===1){
            const slug=routeSlug(parts[0]);
            const allCategories=Object.entries(sections).flatMap(([section,items])=>items.map(item=>({section,item})));
            const match=allCategories.find(({item})=>routeSlug(item.title)===slug);
            if(match){
                event.preventDefault();
                showCategory(match.section,match.item.title,match.item.description,true);
                window.scrollTo({top:0,behavior:"smooth"});
                return;
            }
        }
        if(parts.length>=2){
            const sec=parts[0].toUpperCase();
            if(sections[sec]){
                const wanted=routeSlug(parts.slice(1).join("/"));
                const cat=sections[sec].find(item=>routeSlug(item.title)===wanted);
                if(cat){
                    event.preventDefault();
                    showCategory(sec,cat.title,cat.description,true);
                    window.scrollTo({top:0,behavior:"smooth"});
                    return;
                }
            }
        }
    }
});

/* CONTENIDO HTML SEGURO */

function validHexColor(value){
    return typeof value==="string"&&/^#[0-9a-fA-F]{6}$/.test(value);
}

function safeInlineFontFamily(value){
    const allowed=["Arial","Verdana","Tahoma","Trebuchet MS","Georgia","Times New Roman","Garamond","Courier New"];
    if(typeof value!=="string")return "";
    return allowed.includes(value.replace(/["']/g,"").trim())?value.replace(/["']/g,"").trim():"";
}
function safeInlineFontSize(value){
    if(typeof value!=="string")return "";
    const match=value.match(/^([8-9]|[1-6][0-9]|7[0-2])px$/);
    return match?match[0]:"";
}
function safeInlineColor(value){
    if(typeof value!=="string")return "";
    if(/^#[0-9a-fA-F]{6}$/.test(value))return value;

    const rgb=value.match(/^rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/i);
    if(!rgb)return "";

    const channels=rgb.slice(1).map(Number);
    if(channels.some(channel=>channel<0||channel>255))return "";
    return `rgb(${channels.join(",")})`;
}

function safeHtml(html){
    const parser=new DOMParser();
    const doc=parser.parseFromString(String(html||""),"text/html");
    const allowed=["P","DIV","BR","B","STRONG","I","EM","U","A","SPAN","UL","OL","LI","IMG"];

    function clean(parent){
        [...parent.childNodes].forEach(node=>{
            if(node.nodeType===Node.TEXT_NODE)return;

            if(node.nodeType!==Node.ELEMENT_NODE){
                node.remove();
                return;
            }

            if(!allowed.includes(node.tagName)){
                const children=[...node.childNodes];
                node.replaceWith(...children);

                children.forEach(child=>{
                    if(child.nodeType===Node.ELEMENT_NODE)clean(child);
                });

                return;
            }

            if(node.tagName==="IMG"){
                const rawSrc=node.getAttribute("src")||"";
                let imageUrl;

                try{
                    imageUrl=new URL(rawSrc,location.href);
                }catch(e){
                    node.remove();
                    return;
                }

                if(!["http:","https:"].includes(imageUrl.protocol)){
                    node.remove();
                    return;
                }

                const alt=node.getAttribute("alt")||"Imagen";
                const rawWidth=node.style.width||node.getAttribute("width")||"auto";
                const safeWidth=/^(?:auto|(?:[1-9]\d?|100)%)$/.test(String(rawWidth).trim())
                    ?String(rawWidth).trim():"auto";

                [...node.attributes].forEach(attr=>node.removeAttribute(attr.name));

                node.setAttribute("src",imageUrl.href);
                node.setAttribute("alt",alt.slice(0,200));
                node.setAttribute("loading","lazy");
                node.setAttribute("referrerpolicy","no-referrer");
                node.style.width=safeWidth;
                node.style.maxWidth="100%";
                node.style.height="auto";

                return;
            }

            const savedColor=(node.tagName==="A"||node.tagName==="SPAN")?(node.style.color||""):"";
            const savedFontFamily=node.tagName==="SPAN"?(node.style.fontFamily||""):"";
            const savedFontSize=node.tagName==="SPAN"?(node.style.fontSize||""):"";

            [...node.attributes].forEach(attr=>{
                const name=attr.name.toLowerCase();
                const keepLinkAttribute=node.tagName==="A"&&["href","target","rel"].includes(name);
                const keepSafeStyle=(node.tagName==="A"||node.tagName==="SPAN")&&name==="style";
                if(!keepLinkAttribute&&!keepSafeStyle)node.removeAttribute(attr.name);
            });

            node.removeAttribute("style");
            const safeColor=safeInlineColor(savedColor);
            const safeFamily=safeInlineFontFamily(savedFontFamily);
            const safeSize=safeInlineFontSize(savedFontSize);
            if(safeColor)node.style.color=safeColor;
            if(node.tagName==="SPAN"&&safeFamily)node.style.fontFamily=safeFamily;
            if(node.tagName==="SPAN"&&safeSize)node.style.fontSize=safeSize;

            if(node.tagName==="A"){
                try{
                    const rawHref=(node.getAttribute("href")||"").trim();
                    const url=new URL(rawHref,location.origin);

                    if(!["http:","https:","mailto:"].includes(url.protocol)){
                        const children=[...node.childNodes];
                        node.replaceWith(...children);

                        children.forEach(child=>{
                            if(child.nodeType===Node.ELEMENT_NODE)clean(child);
                        });

                        return;
                    }

                    if(url.origin===location.origin){
                        node.setAttribute("href",url.pathname+url.search+url.hash);
                        node.removeAttribute("target");
                        node.removeAttribute("rel");
                    }else{
                        node.setAttribute("href",url.href);
                        node.setAttribute("target","_blank");
                        node.setAttribute("rel","noopener noreferrer");
                    }

                }catch(e){
                    const children=[...node.childNodes];
                    node.replaceWith(...children);

                    children.forEach(child=>{
                        if(child.nodeType===Node.ELEMENT_NODE)clean(child);
                    });

                    return;
                }
            }

            clean(node);
        });
    }

    clean(doc.body);
    return doc.body.innerHTML;
}

        const fileQuery=firestore.collection("archivos")
            .where("menu","==",section)
            .where("category","==",title);

        function renderLatestIfReady(){
            if(publicationsReady&&filesReady){
                categoryContentCache.set(cacheKey,{
                    publications:latestPublications,
                    files:latestFiles
                });
            }
            renderAvailableContent();
        }

        // Una única suscripción por colección. Las historias no esperan a que terminen los archivos.
        const unsubPub=pubQuery.onSnapshot(snapshot=>{
            latestPublications=[];
            snapshot.forEach(doc=>latestPublications.push({id:doc.id,...doc.data()}));
            publicationsReady=true;
            publicationsError=null;
            renderLatestIfReady();
        },err=>{
            console.error("Error cargando publicaciones:",err);
            publicationsReady=true;
            publicationsError=err;
            renderLatestIfReady();
        });
        activeContentListeners.push(unsubPub);

        const unsubFile=fileQuery.onSnapshot(snapshot=>{
            latestFiles=[];
            snapshot.forEach(doc=>latestFiles.push({id:doc.id,...doc.data()}));
            filesReady=true;
            filesError=null;
            renderLatestIfReady();
        },err=>{
            console.error("Error cargando archivos:",err);
            filesReady=true;
            filesError=err;
            renderLatestIfReady();
        });
        activeContentListeners.push(unsubFile);

        return;

    }catch(error){
        console.error("Error cargando contenido:",error);

        if(token===currentContentToken){
            loading.textContent="No se pudo cargar el contenido. Comprueba los permisos de Firestore.";
        }
    }
}

function showSectionLanding(section,updateUrl=false){
    closeMenus();
    if(updateUrl)changePublicUrl(sectionPath(section));
    saveData("gardenSection",section);
    const content=document.getElementById("content-area");
    ++currentContentToken;
    content.innerHTML="";
    const heading=document.createElement("h2");
    heading.className="content-title";
    heading.textContent=section+" // DIRECTORIO";
    content.appendChild(heading);
    (sections[section]||[])
        .filter(item=>!item.hidden)
        .forEach(item=>{
            const button=document.createElement("button");
            button.type="button";
            button.className="section-category";
            const name=document.createElement("strong");
            name.textContent=item.title;
            button.appendChild(name);
            button.addEventListener("click",()=>showCategory(section,item.title,item.description,true));
            content.appendChild(button);
        });
}

function renderRouteFromPath(){
    const parts=location.pathname.split("/").filter(Boolean).map(part=>{try{return decodeURIComponent(part)}catch(e){return part}});
    if(!parts.length)return false;
    const slug=routeSlug(parts.join("/"));
    const allCategories=Object.entries(sections).flatMap(([section,items])=>items.map(item=>({section,item})));

    // URL pública corta (funciona tanto para categorías visibles como ocultas): /2nd-round, /los-red-room, etc.
    if(parts.length===1){
        const direct=allCategories.find(({item})=>routeSlug(item.title)===slug);
        if(direct){
            const letter=document.getElementById("letter-screen");
            const home=document.getElementById("home-screen");
            if(letter){letter.style.display="none";letter.style.opacity="0";}
            if(home){home.style.display="block";home.style.opacity="1";}
            saveData("gardenEntered","yes");
            showCategory(direct.section,direct.item.title,direct.item.description,false);
            return true;
        }
    }

    // Compatibilidad con enlaces anteriores: /ARC/registros-viejos
    const section=parts[0].toUpperCase();
    if(!sections[section])return false;
    const letter=document.getElementById("letter-screen");
    const home=document.getElementById("home-screen");
    if(letter){letter.style.display="none";letter.style.opacity="0";}
    if(home){home.style.display="block";home.style.opacity="1";}
    saveData("gardenEntered","yes");
    if(parts.length===1){showSectionLanding(section,false);return true;}
    const wanted=routeSlug(parts.slice(1).join("/"));
    const category=(sections[section]||[]).find(item=>routeSlug(item.title)===wanted);
    if(category){showCategory(section,category.title,category.description,false);return true;}
    showSectionLanding(section,false);
    return true;
}

});

function typeWriter(){
    if(typingStarted)return;
    typingStarted=true;
    const textElement=document.getElementById("typed-text");
    const cursor=document.getElementById("cursor");
    const signatureElement=document.getElementById("signature");
    let index=0;
    function type(){
        if(index<welcomeMessage.length){
            textElement.textContent+=welcomeMessage.charAt(index);
            index++;
            setTimeout(type,35);
        }else{
            cursor.style.display="none";
            setTimeout(()=>signatureElement.classList.add("show"),600);
            setTimeout(showHomeScreen,2600);
        }
    }
    type();
}

function showHomeScreen(){
    if(transitionStarted)return;

    transitionStarted=true;

    const letter=document.getElementById("letter-screen");
    const home=document.getElementById("home-screen");

    letter.style.opacity="0";

    setTimeout(()=>{
        letter.style.display="none";
        home.style.display="block";

        setTimeout(()=>home.style.opacity="1",100);

        saveData("gardenEntered","yes");
        showInicio();

    },1500);
}

function initializePage(){
    typingStarted=false;
    if(renderRouteFromPath())return;
    transitionStarted=false;

    const letter=document.getElementById("letter-screen");
    const home=document.getElementById("home-screen");

    if(getSaved("gardenEntered")==="yes"){
        letter.style.display="none";
        letter.style.opacity="0";
        home.style.display="block";
        home.style.opacity="1";
        restoreCategory();
        return;
    }

    letter.style.display="flex";
    home.style.display="none";
    home.style.opacity="0";
    typeWriter();
}

function setupPublicationEditor(titleEditor,bodyEditor,editData=null){

    function forceWhiteOnPaste(editor){
        editor.addEventListener("paste", e=>{
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData("text/plain");
            document.execCommand("insertText", false, text);
            const sel = window.getSelection();
            if(sel && sel.rangeCount){
                const range = sel.getRangeAt(0);
                const span = document.createElement("span");
                span.style.color = "#dedede";
                try{
                    range.surroundContents(span);
                }catch(err){
                    editor.style.color = "#dedede";
                }
            }
            editor.style.color = "#dedede";
        });
    }
    forceWhiteOnPaste(titleEditor);
    forceWhiteOnPaste(bodyEditor);

    let activeEditor=titleEditor;
    let selectedEditorImage=null;
    const savedRanges=new Map([[titleEditor,null],[bodyEditor,null]]);
    const fontPicker=document.getElementById("editor-font-family");
    const sizePicker=document.getElementById("editor-font-size");
    const colorPicker=document.getElementById("editor-text-color");
    const imageSizePicker=document.getElementById("editor-image-size");

    function rememberSelection(editor=activeEditor){
        const selection=window.getSelection();
        if(!selection||!selection.rangeCount)return;
        const range=selection.getRangeAt(0);
        if(editor.contains(range.commonAncestorContainer)){
            savedRanges.set(editor,range.cloneRange());
        }
    }
    function restoreSelection(editor=activeEditor){
        const range=savedRanges.get(editor);
        editor.focus();
        if(!range)return false;
        try{
            const selection=window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            return true;
        }catch(error){return false;}
    }

    [titleEditor,bodyEditor].forEach(editor=>{
        editor.addEventListener("focus",()=>{activeEditor=editor;});
        editor.addEventListener("keyup",()=>rememberSelection(editor));
        editor.addEventListener("mouseup",()=>rememberSelection(editor));
        editor.addEventListener("touchend",()=>setTimeout(()=>rememberSelection(editor),50));
        editor.addEventListener("selectionchange",()=>rememberSelection(editor));
        editor.addEventListener("click",event=>{
            activeEditor=editor;
            const image=event.target?.closest?.("img");
            if(image&&editor.contains(image))selectedEditorImage=image;
        });
        editor.addEventListener("touchend",event=>{
            activeEditor=editor;
            const image=event.target?.closest?.("img");
            if(image&&editor.contains(image))selectedEditorImage=image;
        },{passive:true});
    });
    document.addEventListener("selectionchange",()=>{
        [titleEditor,bodyEditor].forEach(editor=>rememberSelection(editor));
    });

    function applyInlineStyle(property,value){
        const editor=activeEditor;
        restoreSelection(editor);
        const selection=window.getSelection();
        const range=selection&&selection.rangeCount?selection.getRangeAt(0):null;
        if(range&&!range.collapsed&&editor.contains(range.commonAncestorContainer)){
            const span=document.createElement("span");
            span.style[property]=value;
            try{
                span.appendChild(range.extractContents());
                range.insertNode(span);
                const next=document.createRange();next.selectNodeContents(span);
                selection.removeAllRanges();selection.addRange(next);
                savedRanges.set(editor,next.cloneRange());
            }catch(error){console.error("No se pudo aplicar el formato",error);}
        }else{
            editor.style[property]=value;
            if(property==="color"&&editor===titleEditor){
                const titleColor=document.getElementById("record-title-color");
                if(titleColor&&/^#[0-9a-f]{6}$/i.test(value))titleColor.value=value;
            }
        }
    }

    document.querySelectorAll("[data-command]").forEach(button=>{
        button.addEventListener("mousedown",event=>event.preventDefault());
        button.addEventListener("click",()=>{
            restoreSelection(activeEditor);
            document.execCommand(button.dataset.command,false,null);
            rememberSelection(activeEditor);
        });
    });
    fontPicker.addEventListener("change",()=>applyInlineStyle("fontFamily",fontPicker.value));
    sizePicker.addEventListener("change",()=>applyInlineStyle("fontSize",sizePicker.value+"px"));
    colorPicker.addEventListener("input",()=>applyInlineStyle("color",colorPicker.value));

    imageSizePicker.addEventListener("change",event=>{
        if(!selectedEditorImage||!selectedEditorImage.isConnected||!([titleEditor,bodyEditor].some(editor=>editor.contains(selectedEditorImage)))){
            selectedEditorImage=null;
            alert("Toca primero la imagen que quieres cambiar y después selecciona su tamaño.");
            return;
        }
        selectedEditorImage.style.width=event.target.value;
        selectedEditorImage.style.maxWidth="100%";
        selectedEditorImage.style.height="auto";
    });

    const insertButton=document.getElementById("insert-link");
    function handleInsertLink(event){
        event.preventDefault();
        event.stopPropagation();
        const editor=activeEditor;
        if(!restoreSelection(editor)){
            alert("Selecciona primero la palabra o frase que quieres enlazar.");
            return;
        }
        const selection=window.getSelection();
        if(!selection||selection.isCollapsed){
            alert("Selecciona primero una palabra o frase.");
            return;
        }
        const raw=prompt("Introduce la ruta interna (ej: /2nd-round) o URL (https://...)");
        if(!raw)return;
        const trimmed=raw.trim();
        let url;
        try{
            url=new URL(trimmed,location.origin);
        }catch(e){
            alert("La dirección no es válida.");
            return;
        }
        if(!["http:","https:","mailto:"].includes(url.protocol)){
            alert("Solo se permiten enlaces http, https, mailto o rutas internas (/ruta).");
            return;
        }
        const finalHref=url.origin===location.origin?(url.pathname+url.search+url.hash):url.href;
        document.execCommand("createLink",false,finalHref);
        editor.querySelectorAll("a").forEach(a=>{
            const aHref=a.getAttribute("href")||"";
            try{
                const parsed=new URL(aHref,location.origin);
                if(parsed.origin===location.origin){
                    a.removeAttribute("target");
                    a.removeAttribute("rel");
                }else{
                    a.target="_blank";
                    a.rel="noopener noreferrer";
                }
            }catch(e){}
        });
        rememberSelection(editor);
    }
    insertButton.addEventListener("click",handleInsertLink);
    insertButton.addEventListener("touchend",handleInsertLink);
    document.getElementById("remove-link").addEventListener("mousedown",event=>event.preventDefault());
    document.getElementById("remove-link").addEventListener("click",()=>{
        restoreSelection(activeEditor);document.execCommand("unlink",false,null);rememberSelection(activeEditor);
    });
    const imageButton=document.getElementById("insert-image");
    imageButton.addEventListener("mousedown",event=>event.preventDefault());
    imageButton.addEventListener("click",()=>{
        const editor=activeEditor;restoreSelection(editor);
        const raw=prompt("Pega la dirección directa de la imagen (JPG, PNG, GIF o WEBP)");
        if(!raw)return;
        let url;
        try{url=new URL(raw.trim());}catch(e){alert("La dirección no es válida.");return;}
        if(!["http:","https:"].includes(url.protocol)){alert("Solo se permiten direcciones http o https.");return;}
        if(!/\.(avif|bmp|gif|jpe?g|png|svg|webp)$/i.test(url.pathname)&&!confirm("La dirección no termina en una extensión de imagen conocida. ¿Quieres intentarlo de todas formas?"))return;
        const img=document.createElement("img");img.src=url.href;img.alt="Imagen";img.loading="lazy";img.referrerPolicy="no-referrer";
        const selection=window.getSelection();
        if(selection&&selection.rangeCount&&editor.contains(selection.anchorNode)){
            const range=selection.getRangeAt(0);range.deleteContents();range.insertNode(img);
            const space=document.createTextNode(" ");img.after(space);range.setStartAfter(space);range.collapse(true);
            selection.removeAllRanges();selection.addRange(range);
        }else editor.appendChild(img);
        selectedEditorImage=img;rememberSelection(editor);
    });

    const titleFont=safeInlineFontFamily(editData?.titleFontFamily||"");
    const titleSize=safeInlineFontSize(editData?.titleFontSize||"");
    const bodyFont=safeInlineFontFamily(editData?.bodyFontFamily||"");
    const bodySize=safeInlineFontSize(editData?.bodyFontSize||"");
    if(titleFont)titleEditor.style.fontFamily=titleFont;
    if(titleSize)titleEditor.style.fontSize=titleSize;
    if(validHexColor(editData?.titleColor))titleEditor.style.color=editData.titleColor;
    if(bodyFont)bodyEditor.style.fontFamily=bodyFont;
    if(bodySize)bodyEditor.style.fontSize=bodySize;
    if(validHexColor(editData?.bodyColor))bodyEditor.style.color=editData.bodyColor;
    fontPicker.value=titleFont||bodyFont||"Arial";
    sizePicker.value=(titleSize||bodySize||"16px").replace("px","");
    colorPicker.value=validHexColor(titleEditor.style.color)?titleEditor.style.color:(validHexColor(bodyEditor.style.color)?bodyEditor.style.color:"#c5c5c5");
}

/* PANEL ADMINISTRATIVO */

function renderAdminTab(tab){
    const panel=document.getElementById("admin-panel-content");
    if(tab==="contenido"){renderPublicationEditor();return;}
    if(tab==="gestor"){renderPublicationManager();return;}
    if(tab==="archivos"){renderFileEditor();return;}
    if(tab==="configuracion"){renderConfiguration();return;}
}

/* PUBLICACIONES */

function renderPublicationEditor(editData=null){
    const panel=document.getElementById("admin-panel-content");
    const menu=sections[editData?.menu]?editData.menu:"HOME";
    const category=sections[menu]?.some(item=>item.title===editData?.category)?editData.category:"Entrada";
    panel.innerHTML=`
    <div class="admin-box">
        <p class="admin-subtitle">${editData?"EDITAR PUBLICACIÓN":"NUEVA PUBLICACIÓN"}</p>
        ${addLocationSelectors(menu,category)}
        ${editorToolbar()}
        <label class="admin-status" for="record-title">TÍTULO</label>
        <div class="admin-input rich-editor title-editor" id="record-title" contenteditable="true" role="textbox" aria-label="Título" data-placeholder="" style="min-height:48px;overflow-wrap:anywhere"></div>
        <label class="admin-status" for="rich-editor">CONTENIDO</label>
        <div class="rich-editor" id="rich-editor" contenteditable="true" role="textbox" aria-label="Contenido" spellcheck="true"></div>
        <div class="admin-actions">
            <button class="admin-button" id="record-save">${editData?"GUARDAR CAMBIOS":"PUBLICAR"}</button>
            <button class="admin-button" id="record-cancel">CANCELAR</button>
        </div>
        <p class="admin-status" id="record-status"></p>
    </div>`;

    const menuSelect=document.getElementById("record-menu");
    const categorySelect=document.getElementById("record-category");
    menuSelect.addEventListener("change",()=>fillCategorySelect(menuSelect,categorySelect));
    const titleEditor=document.getElementById("record-title");
    const bodyEditor=document.getElementById("rich-editor");
    titleEditor.innerHTML=editData?.titleHtml?safeHtml(editData.titleHtml):String(editData?.title||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    bodyEditor.innerHTML=safeHtml(editData?.bodyHtml||"");
    setupPublicationEditor(titleEditor,bodyEditor,editData);

    document.getElementById("record-cancel").addEventListener("click",()=>{
        if(editData){
            gestorTargetLocation={section:sections[editData.menu]?editData.menu:"HOME",category:sections[editData.menu]?.some(item=>item.title===editData.category)?editData.category:"Entrada"};
        }
        editingId=null;
        document.querySelectorAll(".admin-tab").forEach(button=>button.classList.toggle("active",button.dataset.adminTab==="gestor"));
        localStorage.setItem("0site_admin_tab","gestor");
        renderAdminTab("gestor");
    });

    document.getElementById("record-save").addEventListener("click",async()=>{
        const title=titleEditor.innerText.trim();
        const titleHtml=safeHtml(titleEditor.innerHTML);
        const bodyHtml=safeHtml(bodyEditor.innerHTML);
        const status=document.getElementById("record-status");
        const saveButton=document.getElementById("record-save");
        const hasImage=!!bodyEditor.querySelector("img");
        const hasText=!!bodyEditor.textContent.trim();
        if((!title&&!hasImage)||(!hasText&&!hasImage)){
            status.textContent="Completa el título y el contenido, o inserta una imagen en el contenido.";return;
        }
        saveButton.disabled=true;status.textContent="Guardando publicación...";
        const newMenu=menuSelect.value;
        const newCategory=categorySelect.value;
        const sameLocation=editData&&editData.menu===newMenu&&editData.category===newCategory;
        const data={
            menu:newMenu,category:newCategory,title,titleHtml,
            titleColor:validHexColor(titleEditor.style.color)?titleEditor.style.color:"#cccccc",
            titleFontFamily:safeInlineFontFamily(titleEditor.style.fontFamily)||"",
            titleFontSize:safeInlineFontSize(titleEditor.style.fontSize)||"",
            bodyColor:validHexColor(bodyEditor.style.color)?bodyEditor.style.color:"",
            bodyFontFamily:safeInlineFontFamily(bodyEditor.style.fontFamily)||"",
            bodyFontSize:safeInlineFontSize(bodyEditor.style.fontSize)||"",
            bodyHtml,
            updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        };
        try{
            if(editingId){
                if(sameLocation&&hasCustomOrder(editData))data.order=editData.order;
                else data.order=await prepareNextOrder("publicaciones",newMenu,newCategory,editingId);
                await firestore.collection("publicaciones").doc(editingId).update(data);
                editingId=null;
                gestorTargetLocation={section:newMenu,category:newCategory};
                document.querySelectorAll(".admin-tab").forEach(button=>button.classList.toggle("active",button.dataset.adminTab==="gestor"));
                localStorage.setItem("0site_admin_tab","gestor");
                renderAdminTab("gestor");
                return;
            }else{
                data.order=await prepareNextOrder("publicaciones",newMenu,newCategory);
                data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
                await firestore.collection("publicaciones").add(data);
                status.textContent="Publicación publicada correctamente.";
            }
            editingId=null;
            titleEditor.innerHTML="";bodyEditor.innerHTML="";
            titleEditor.removeAttribute("style");bodyEditor.removeAttribute("style");
            document.getElementById("editor-font-family").value="Arial";
            document.getElementById("editor-font-size").value="16";
            document.getElementById("editor-text-color").value="#c5c5c5";
            document.getElementById("editor-image-size").value="auto";
            saveButton.textContent="PUBLICAR";
            setTimeout(()=>{if(document.getElementById("record-status"))document.getElementById("record-status").textContent="";},3500);
        }catch(error){
            console.error(error);status.textContent="No se pudo guardar. Comprueba los permisos de Firestore.";
        }finally{saveButton.disabled=false;}
    });
}

async function renderPublicationManager(){
    const panel=document.getElementById("admin-panel-content");
    panel.innerHTML=`<div class="admin-box"><p class="admin-subtitle">GESTOR DE PUBLICACIONES</p><div id="gestor-publication-list" class="admin-status">Cargando publicaciones...</div></div>`;
    await loadPublicationList();
}

async function loadPublicationList(keepOpenState=null){
    const list=document.getElementById("gestor-publication-list");
    if(!list)return;
    const openSections=new Set();
    const openCategories=new Set();
    if(keepOpenState){
        keepOpenState.sections.forEach(s=>openSections.add(s));
        keepOpenState.categories.forEach(c=>openCategories.add(c));
    }else{
        list.querySelectorAll("details.publication-group[open]").forEach(el=>{
            if(el.dataset.section)openSections.add(el.dataset.section);
        });
        list.querySelectorAll("details.publication-category[open]").forEach(el=>{
            if(el.dataset.key)openCategories.add(el.dataset.key);
        });
    }
    if(gestorTargetLocation){
        openSections.add(gestorTargetLocation.section);
        openCategories.add(gestorTargetLocation.section+"::"+gestorTargetLocation.category);
        gestorTargetLocation=null;
    }
    try{
        const snapshot=await firestore.collection("publicaciones").get();
        if(!document.getElementById("gestor-publication-list"))return;
        list.innerHTML="";
        if(snapshot.empty){list.textContent="No hay publicaciones todavía.";return;}
        const docs=[];snapshot.forEach(doc=>docs.push({id:doc.id,...doc.data()}));
        const sectionsOrder=["HOME","SHA","SEC","OBL","ARC"];
        const categories={};
        docs.forEach(item=>{
            const section=item.menu||"SIN SECCIÓN";const category=item.category||"Sin categoría";
            categories[section]??={};categories[section][category]??=[];categories[section][category].push(item);
        });
        [...new Set([...sectionsOrder,...Object.keys(categories)])].forEach(section=>{
            if(!categories[section])return;
            const sectionBox=document.createElement("details");sectionBox.className="publication-group";
            sectionBox.dataset.section=section;
            if(openSections.has(section))sectionBox.open=true;
            const sectionTitle=document.createElement("summary");sectionTitle.textContent=section;sectionBox.appendChild(sectionTitle);
            Object.keys(categories[section]).sort((a,b)=>a.localeCompare(b)).forEach(category=>{
                const categoryBox=document.createElement("details");categoryBox.className="publication-category";
                const catKey=section+"::"+category;
                categoryBox.dataset.key=catKey;
                if(openCategories.has(catKey))categoryBox.open=true;
                const isHiddenCat=(sections[section]||[]).find(c=>c.title===category)?.hidden;
                const categoryTitle=document.createElement("summary");
                categoryTitle.textContent=category+(isHiddenCat?" [OCULTA]":"");
                categoryBox.appendChild(categoryTitle);
                sortRecords(categories[section][category]).forEach(item=>{
                    const row=document.createElement("div");row.className="admin-record";
                    const label=document.createElement("span");label.textContent=item.title||"Sin título";
                    const actions=document.createElement("div");actions.className="admin-actions";
                    const ordered = sortRecords(categories[section][category]);
                    const pos = ordered.findIndex(r => r.id === item.id);

                    const up=document.createElement("button");
                    up.className="move-button";
                    up.textContent="↑";
                    up.title="Subir";
                    up.disabled = pos === 0;
                    up.addEventListener("click", () => {
                        moveRecord("publicaciones", ordered, pos, -1, loadPublicationList);
                    });

                    const down=document.createElement("button");
                    down.className="move-button";
                    down.textContent="↓";
                    down.title="Bajar";
                    down.disabled = pos === ordered.length - 1;
                    down.addEventListener("click", () => {
                        moveRecord("publicaciones", ordered, pos, 1, loadPublicationList);
                    });

                    const edit=document.createElement("button");edit.textContent="EDITAR";
                    edit.addEventListener("click",()=>{
                        editingId=item.id;
                        document.querySelectorAll(".admin-tab").forEach(button=>button.classList.toggle("active",button.dataset.adminTab==="contenido"));
                        localStorage.setItem("0site_admin_tab","contenido");
                        renderPublicationEditor(item);
                    });
                    const remove=document.createElement("button");remove.textContent="ELIMINAR";remove.className="admin-danger";
                    remove.addEventListener("click",async()=>{
                        if(!confirm("¿Eliminar esta publicación definitivamente?"))return;
                        try{await firestore.collection("publicaciones").doc(item.id).delete();await loadPublicationList();}
                        catch(error){console.error(error);alert("No se pudo eliminar. Comprueba los permisos de Firestore.");}
                    });
                    actions.append(up, down, edit, remove);row.append(label,actions);categoryBox.appendChild(row);
                });
                sectionBox.appendChild(categoryBox);
            });
            list.appendChild(sectionBox);
        });
    }catch(error){console.error(error);list.textContent="No se pudieron cargar las publicaciones. Revisa los permisos de Firestore.";}
}

function refreshPublicationManagement(){if(document.getElementById("gestor-publication-list"))loadPublicationList();}

/* ARCHIVOS */

function renderFileEditor(editData=null){
    const panel=document.getElementById("admin-panel-content");

    const menu=sections[editData?.menu]?editData.menu:"HOME";
    const category=sections[menu]?.some(item=>item.title===editData?.category)?editData.category:"Entrada";

    panel.innerHTML=`
    <div class="admin-box">
        <p class="admin-subtitle">${editData?"EDITAR ARCHIVO":"AÑADIR ARCHIVO"}</p>

        ${addLocationSelectors(menu,category)}

        <label class="admin-status">NOMBRE DEL ARCHIVO</label>
        <input class="admin-input" id="file-title" placeholder="Nombre o título">

        <label class="admin-status">DESCRIPCIÓN</label>
        <textarea class="admin-textarea" id="file-description" placeholder="Descripción breve"></textarea>

        <label class="admin-status">DIRECCIÓN DEL ARCHIVO</label>
        <input class="admin-input" id="file-url" type="url" placeholder="https://...">

        <label class="admin-status">TEXTO DEL ENLACE</label>
        <input class="admin-input" id="file-label" placeholder="Abrir archivo">

        <p class="admin-hint">Si la dirección corresponde a una imagen JPG, PNG, GIF, WEBP, AVIF o SVG, se mostrará directamente. Los demás archivos conservarán el enlace.</p>

        <div class="admin-actions">
            <button class="admin-button" id="file-save">${editData?"GUARDAR CAMBIOS":"AÑADIR ARCHIVO"}</button>
            <button class="admin-button" id="file-cancel">CANCELAR</button>
        </div>

        <p class="admin-status" id="file-status"></p>
    </div>

    <div class="admin-box">
        <p class="admin-subtitle">ARCHIVOS EXISTENTES</p>
        <p class="admin-hint">Usa ↑ y ↓ para cambiar la posición de un archivo dentro de su categoría.</p>
        <div id="file-list" class="admin-status">Cargando...</div>
    </div>`;

    const menuSelect=document.getElementById("record-menu");
    const categorySelect=document.getElementById("record-category");

    menuSelect.addEventListener("change",()=>{
        fillCategorySelect(menuSelect,categorySelect);
    });

    if(editData){
        document.getElementById("file-title").value=editData.title||"";
        document.getElementById("file-description").value=editData.description||"";
        document.getElementById("file-url").value=editData.url||"";
        document.getElementById("file-label").value=editData.linkLabel||"Abrir archivo";
    }

    document.getElementById("file-cancel").addEventListener("click",()=>{
        editingId=null;
        renderFileEditor();
    });

    document.getElementById("file-save").addEventListener("click",async()=>{
        const title=document.getElementById("file-title").value.trim();
        const description=document.getElementById("file-description").value.trim();
        const rawUrl=document.getElementById("file-url").value.trim();
        const linkLabel=document.getElementById("file-label").value.trim()||"Abrir archivo";

        const status=document.getElementById("file-status");
        const saveButton=document.getElementById("file-save");

        let url;

        try{
            url=new URL(rawUrl);

        }catch(e){
            status.textContent="Introduce una dirección válida.";
            return;
        }

        if(!["http:","https:"].includes(url.protocol)){
            status.textContent="Solo se permiten enlaces http o https.";
            return;
        }

        if(!title){
            status.textContent="Escribe un nombre para el archivo.";
            return;
        }

        saveButton.disabled=true;
        status.textContent="Guardando archivo...";

        const newMenu=menuSelect.value;
        const newCategory=categorySelect.value;

        const sameLocation=editData&&
            editData.menu===newMenu&&
            editData.category===newCategory;

        const data={
            menu:newMenu,
            category:newCategory,
            title,
            description,
            url:url.href,
            linkLabel,
            updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        };

        try{
            if(editingId){
                if(sameLocation&&hasCustomOrder(editData)){
                    data.order=editData.order;

                }else{
                    data.order=await prepareNextOrder(
                        "archivos",
                        newMenu,
                        newCategory,
                        editingId
                    );
                }

                await firestore.collection("archivos").doc(editingId).update(data);

                status.textContent="Archivo actualizado.";

            }else{
                data.order=await prepareNextOrder(
                    "archivos",
                    newMenu,
                    newCategory
                );

                data.createdAt=firebase.firestore.FieldValue.serverTimestamp();

                await firestore.collection("archivos").add(data);

                status.textContent="Archivo añadido.";
            }

            editingId=null;

            document.getElementById("file-title").value="";
            document.getElementById("file-description").value="";
            document.getElementById("file-url").value="";
            document.getElementById("file-label").value="";

            saveButton.textContent="AÑADIR ARCHIVO";

            await loadFileList();

        }catch(error){
            console.error(error);
            status.textContent="No se pudo guardar. Comprueba los permisos de Firestore.";

        }finally{
            saveButton.disabled=false;
        }
    });

    loadFileList();
}

async function loadFileList(){
    const list=document.getElementById("file-list");

    if(!list)return;

    try{
        const snapshot=await firestore.collection("archivos").get();

        if(!document.getElementById("file-list"))return;

        list.innerHTML="";

        if(snapshot.empty){
            list.textContent="No hay archivos todavía.";
            return;
        }

        const items=[];

        snapshot.forEach(doc=>{
            items.push({id:doc.id,...doc.data()});
        });

        items.sort((a,b)=>{
            const groupA=(a.menu||"")+"|"+(a.category||"");
            const groupB=(b.menu||"")+"|"+(b.category||"");

            if(groupA!==groupB)return groupA.localeCompare(groupB);

            return compareRecords(a,b);
        });

        const groupPositions={};

        items.forEach(item=>{
            const groupKey=(item.menu||"")+"|"+(item.category||"");

            if(!groupPositions[groupKey]){
                groupPositions[groupKey]=sortRecords(
                    items.filter(record=>
                        record.menu===item.menu&&
                        record.category===item.category
                    )
                );
            }

            const group=groupPositions[groupKey];
            const position=group.findIndex(record=>record.id===item.id);

            const row=document.createElement("div");
            row.className="admin-record";

            const label=document.createElement("span");
            label.textContent=`${item.menu||""} / ${item.category||""} — ${item.title||"Archivo"}`;

            const actions=document.createElement("div");
            actions.className="admin-actions";

            const up=document.createElement("button");
            up.className="move-button";
            up.textContent="↑";
            up.title="Mover hacia arriba";
            up.disabled=position===0;

            up.addEventListener("click",()=>{
                moveRecord("archivos",group,position,-1,loadFileList);
            });

            const down=document.createElement("button");
            down.className="move-button";
            down.textContent="↓";
            down.title="Mover hacia abajo";
            down.disabled=position===group.length-1;

            down.addEventListener("click",()=>{
                moveRecord("archivos",group,position,1,loadFileList);
            });

            const edit=document.createElement("button");
            edit.textContent="EDITAR";

            edit.addEventListener("click",()=>{
                editingId=item.id;
                renderFileEditor(item);
            });

            const remove=document.createElement("button");
            remove.textContent="ELIMINAR";
            remove.className="admin-danger";

            remove.addEventListener("click",async()=>{
                if(!confirm("¿Eliminar este archivo?"))return;

                try{
                    await firestore.collection("archivos").doc(item.id).delete();
                    loadFileList();

                }catch(error){
                    console.error(error);
                    alert("No se pudo eliminar.");
                }
            });

            actions.append(up,down,edit,remove);
            row.append(label,actions);
            list.appendChild(row);
        });

    }catch(error){
        console.error(error);
        list.textContent="No se pudieron cargar los archivos. Revisa los permisos de Firestore.";
    }
}

/* CONFIGURACIÓN (CON CATEGORÍAS OCULTAS Y RUTAS DIRECTAS) */

function renderConfiguration(){
    const panel=document.getElementById("admin-panel-content");

    panel.innerHTML=`
    <div class="admin-box">
        <p class="admin-subtitle">MENÚS Y CATEGORÍAS</p>
        <p class="admin-hint">Cambia el nombre de las categorías, añade nuevas, modifica su posición o márcalas como <b>Oculta</b> para que no aparezcan en el menú superior y solo se abran mediante enlace (ej: <code>/2nd-round</code>).</p>
        <label class="admin-status">MENÚ</label>
        <select class="admin-select" id="category-menu-select">
            ${Object.keys(sections).filter(key=>key!=="INICIO").map(key=>`<option value="${key}">${key}</option>`).join("")}
        </select>
        <div id="category-order-list" class="category-order-list"></div>
        <label class="admin-status">NUEVA CATEGORÍA</label>
        <input class="admin-input" id="new-category-name" maxlength="60" placeholder="Nombre de la categoría (ej: 2nd-round o los-red-room)">
        <label class="category-hidden-toggle" style="display:inline-flex;margin-bottom:12px;">
            <input type="checkbox" id="new-category-hidden"> Oculta (no visible en los menús públicos, solo accesible por enlace)
        </label>
        <div id="new-category-preview" class="admin-hint" style="margin-top:0;margin-bottom:12px;"></div>
        <button class="admin-button" id="add-category-button">AÑADIR CATEGORÍA</button>
        <div class="admin-actions">
            <button class="admin-button" id="save-category-settings">GUARDAR CAMBIOS</button>
        </div>
        <p class="admin-status" id="category-settings-status"></p>
    </div>
    <div class="admin-box">
        <p class="admin-subtitle">OTRAS CONFIGURACIONES</p>
        <p class="admin-hint">El formato de títulos y contenido se controla desde la barra de herramientas de la pestaña CONTENIDO.</p>
        <input class="admin-input" id="config-key" placeholder="Nombre de la opción">
        <textarea class="admin-textarea" id="config-value" placeholder="Valor"></textarea>
        <button class="admin-button" id="config-save">GUARDAR CONFIGURACIÓN</button>
        <p class="admin-status" id="config-status"></p>
        <div id="config-list" class="admin-status">Cargando...</div>
    </div>
`;

    loadConfig();

    let categoryDraft=cloneSectionSettings();
    const menuPicker=document.getElementById("category-menu-select");
    const categoryList=document.getElementById("category-order-list");
    const categoryStatus=document.getElementById("category-settings-status");
    const newCatInput=document.getElementById("new-category-name");
    const newCatPreview=document.getElementById("new-category-preview");

    newCatInput.addEventListener("input",()=>{
        const slug=routeSlug(newCatInput.value);
        newCatPreview.textContent=slug?`Ruta del enlace: ${location.origin}/${slug}  (o ${slug} en el editor)`:"";
    });

    function drawCategoryDraft(){
        const menu=menuPicker.value;
        categoryList.innerHTML="";
        categoryDraft[menu].forEach((item,index)=>{
            const row=document.createElement("div");
            row.className="category-order-row";

            const name=document.createElement("input");
            name.className="admin-input";
            name.maxLength=60;
            name.value=item.title;
            name.title="Ruta: /"+routeSlug(item.title);
            name.setAttribute("aria-label","Nombre de categoría");
            name.addEventListener("input",()=>{
                item.title=name.value;
                name.title="Ruta: /"+routeSlug(item.title);
            });

            const hiddenLabel=document.createElement("label");
            hiddenLabel.className="category-hidden-toggle"+(item.hidden?" is-hidden":"");
            hiddenLabel.title="Si está marcada, no sale en los menús superiores y solo se abre por enlace /"+routeSlug(item.title);
            const hiddenCheck=document.createElement("input");
            hiddenCheck.type="checkbox";
            hiddenCheck.checked=Boolean(item.hidden);
            hiddenCheck.addEventListener("change",()=>{
                item.hidden=hiddenCheck.checked;
                hiddenLabel.classList.toggle("is-hidden",item.hidden);
            });
            hiddenLabel.append(hiddenCheck,document.createTextNode(" Oculta"));

            const up=document.createElement("button");
            up.type="button";up.textContent="↑";up.title="Subir";
            up.disabled=index===0;
            up.addEventListener("click",()=>{
                [categoryDraft[menu][index-1],categoryDraft[menu][index]]=[categoryDraft[menu][index],categoryDraft[menu][index-1]];
                drawCategoryDraft();
            });

            const down=document.createElement("button");
            down.type="button";down.textContent="↓";down.title="Bajar";
            down.disabled=index===categoryDraft[menu].length-1;
            down.addEventListener("click",()=>{
                [categoryDraft[menu][index+1],categoryDraft[menu][index]]=[categoryDraft[menu][index],categoryDraft[menu][index+1]];
                drawCategoryDraft();
            });

            const del=document.createElement("button");
            del.type="button";del.textContent="✕";del.title="Eliminar categoría";
            del.className="admin-danger";
            del.disabled=categoryDraft[menu].length<=1;
            del.addEventListener("click",()=>{
                if(!confirm(`¿Quitar la categoría "${item.title}"? (Recuerda pulsar GUARDAR CAMBIOS para confirmar)`))return;
                categoryDraft[menu].splice(index,1);
                drawCategoryDraft();
            });

            row.append(name,hiddenLabel,up,down,del);
            categoryList.appendChild(row);
        });
    }
    menuPicker.addEventListener("change",drawCategoryDraft);
    document.getElementById("add-category-button").addEventListener("click",()=>{
        const input=document.getElementById("new-category-name");
        const hiddenInput=document.getElementById("new-category-hidden");
        const title=input.value.trim();
        const isHidden=hiddenInput.checked;
        const menu=menuPicker.value;
        if(!title){categoryStatus.textContent="Escribe un nombre para la categoría.";return;}
        if(categoryDraft[menu].some(item=>item.title.toLowerCase()===title.toLowerCase())){
            categoryStatus.textContent="Esa categoría ya existe en este menú.";return;
        }
        categoryDraft[menu].push({title,description:"",hidden:isHidden});
        input.value="";
        hiddenInput.checked=false;
        newCatPreview.textContent="";
        const slug=routeSlug(title);
        categoryStatus.textContent=`Categoría añadida${isHidden?" (oculta)":""}. Ruta: /${slug} — Pulsa GUARDAR CAMBIOS para activarla.`;
        drawCategoryDraft();
    });
    document.getElementById("save-category-settings").addEventListener("click",async()=>{
        const invalid=Object.values(categoryDraft).some(list=>
            list.some(item=>!item.title.trim())||
            new Set(list.map(item=>item.title.trim().toLowerCase())).size!==list.length
        );
        if(invalid){categoryStatus.textContent="Revisa los nombres: no pueden estar vacíos ni repetidos.";return;}
        try{
            const clean={};
            Object.keys(categoryDraft).forEach(key=>{
                clean[key]=categoryDraft[key].map(item=>({
                    ...item,
                    title:item.title.trim(),
                    hidden:Boolean(item.hidden)
                }));
            });
            await firestore.collection("configuracion").doc("__categorias").set({
                sections:clean,
                updatedAt:firebase.firestore.FieldValue.serverTimestamp()
            });
            applySectionSettings(clean);
            buildPublicMenus();
            categoryDraft=cloneSectionSettings();
            drawCategoryDraft();
            categoryStatus.textContent="Categorías, estados ocultos y orden guardados correctamente.";
        }catch(error){
            console.error(error);
            categoryStatus.textContent="No se pudo guardar. Comprueba los permisos de Firestore.";
        }
    });
    drawCategoryDraft();

    document.getElementById("config-save").addEventListener("click",async()=>{
        const key=document.getElementById("config-key").value.trim();
        const value=document.getElementById("config-value").value.trim();
        const status=document.getElementById("config-status");

        if(!key||!value){
            status.textContent="Completa ambos campos.";
            return;
        }

        try{
            await firestore.collection("configuracion").doc(key).set({
                value,
                updatedAt:firebase.firestore.FieldValue.serverTimestamp()
            });
            status.textContent="Configuración guardada.";
            loadConfig();
        }catch(error){
            console.error(error);
            status.textContent="No se pudo guardar. Revisa los permisos de Firestore.";
        }
    });
}

async function loadConfig(){
    const list=document.getElementById("config-list");

    if(!list)return;

    try{
        const snapshot=await firestore.collection("configuracion").get();

        if(!document.getElementById("config-list"))return;

        list.innerHTML="";

        if(snapshot.empty){
            list.textContent="No hay opciones guardadas.";
            return;
        }

        snapshot.forEach(doc=>{
            if(doc.id.startsWith("__"))return;
            const row=document.createElement("div");
            row.className="admin-record";

            const label=document.createElement("span");
            label.textContent=doc.id+": "+(doc.data().value||"");

            const remove=document.createElement("button");
            remove.textContent="ELIMINAR";

            remove.addEventListener("click",async()=>{
                if(!confirm("¿Eliminar esta configuración?"))return;

                try{
                    await firestore.collection("configuracion").doc(doc.id).delete();
                    loadConfig();

                }catch(error){
                    console.error(error);
                    alert("No se pudo eliminar.");
                }
            });

            row.append(label,remove);
            list.appendChild(row);
        });

    }catch(error){
        console.error(error);
        list.textContent="No se pudo cargar la configuración. Revisa los permisos de Firestore.";
    }
}

/* INICIO */

initializePage();

}
</script>
