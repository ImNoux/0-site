            check:()=>window.firebase&&typeof firebase.firestore==="function"
        }
    ];

    function loadScript(url){
        return new Promise((resolve,reject)=>{
            const script=document.createElement("script");
            let finished=false;

            const timeout=setTimeout(()=>{
                if(finished)return;
                finished=true;
                script.remove();
                reject(new Error("Tiempo de espera agotado: "+url));
            },15000);

            script.src=url;
            script.onload=()=>{
                if(finished)return;
                finished=true;
                clearTimeout(timeout);
                resolve();
            };
            script.onerror=()=>{
                if(finished)return;
                finished=true;
                clearTimeout(timeout);
                script.remove();
                reject(new Error("No se pudo cargar: "+url));
            };

            document.head.appendChild(script);
        });
    }

    async function loadLibrary(source){
        try{
            await loadScript(source.primary);
            if(source.check())return;
            throw new Error("La librería principal no quedó disponible.");
        }catch(primaryError){
            await loadScript(source.fallback);
            if(!source.check()){
                throw new Error("La librería alternativa tampoco quedó disponible.");
            }
        }
    }

    async function loadAll(){
        for(const source of sources){
            await loadLibrary(source);
        }

        if(!window.firebase)throw new Error("Firebase no está disponible.");
        startGarden();
    }

    loadAll().catch(error=>{
        console.error("Error cargando Firebase:",error);
        const message=document.createElement("div");

        message.textContent="No se pudieron cargar las librerías de Firebase. Comprueba tu conexión o si el navegador bloquea los servidores de Firebase.";
        document.body.appendChild(message);
    });
})();

function hasCustomOrder(item){
    return typeof item.order==="number"&&Number.isFinite(item.order);
}

function compareRecords(a,b){
    if(hasCustomOrder(a)&&hasCustomOrder(b)){
        return a.order-b.order;
    }

    const ta=a.createdAt?.toMillis?.()||0;
    const tb=b.createdAt?.toMillis?.()||0;
    return tb-ta;
}

function sortRecords(items){
    return [...items].sort(compareRecords);
}

async function prepareNextOrder(collectionName,menu,category,excludeId=null){
    const snapshot=await firestore.collection(collectionName)
        .where("menu","==",menu)
        .get();

    const records=[];

    snapshot.forEach(doc=>{
        if(doc.id===excludeId)return;

        const data=doc.data();

        if(data.category===category){
            records.push({id:doc.id,...data});
        }
    });

    const ordered=sortRecords(records);
    const batch=firestore.batch();

    ordered.forEach((item,index)=>{
        batch.update(
            firestore.collection(collectionName).doc(item.id),
            {order:index}
        );
    });

    if(ordered.length){
        await batch.commit();
    }

    return ordered.length;
}

async function moveRecord(collectionName,records,index,direction,reloadFunction){
    const ordered=sortRecords(records);
    const newIndex=index+direction;

    if(newIndex<0||newIndex>=ordered.length)return;

    const first=ordered[index];
    const second=ordered[newIndex];

    if(first.menu!==second.menu||first.category!==second.category)return;

    [ordered[index],ordered[newIndex]]=[ordered[newIndex],ordered[index]];

    const batch=firestore.batch();
    const collection=firestore.collection(collectionName);

    ordered.forEach((item,position)=>{
        batch.update(collection.doc(item.id),{
            order:position
        });
    });

    try{
        await batch.commit();
        await reloadFunction();
    }catch(error){
        console.error("Error cambiando el orden:",error);
        alert("No se pudo guardar el nuevo orden. Comprueba tu conexión e inténtalo de nuevo.");
    }
}

function attachGuestbookListener(targetId,allowDelete){
    if(guestbookListener){
        guestbookListener.off("value");
        guestbookListener=null;
    }

    guestbookListener=database.ref("guestbook");

    guestbookListener.on("value",snapshot=>{

        renderGuestbook(snapshot,targetId,allowDelete);

    },error=>{

            errorMessage.textContent="No se pudieron cargar las firmas: "+(error.message||"Error de conexión.");

function renderGuestbook(snapshot,targetId="guest-list",allowDelete=false){
    const list=document.getElementById(targetId);

    if(!list)return;

    list.innerHTML="<div class='guest-label'>REGISTROS DE VISITANTES</div>";

    if(!snapshot||!snapshot.exists()){
        const empty=document.createElement("p");
        empty.className="admin-status";
        empty.textContent="Todavía no hay firmas.";
        list.appendChild(empty);
        return;
    }

    const entries=[];

    snapshot.forEach(child=>{
        const data=child.val()||{};

        entries.push({
            id:child.key,
            name:data.name||"Visitante",
            msg:data.msg||"",
            ts:Number(data.ts)||0
        });
    });

    entries.sort((a,b)=>b.ts-a.ts);

    /*
    Condición estricta:
    el botón solo se muestra en la lista administrativa,
    con la cuenta correcta y el panel abierto.
    */

    const adminScreen=document.getElementById("admin-screen");
    const dashboard=document.getElementById("admin-dashboard");

    const canDelete=
        allowDelete===true &&
        targetId==="admin-guest-list" &&
        currentUser &&
        currentUser.uid===ADMIN_UID &&
        adminScreen &&
        adminScreen.style.display==="block" &&
        dashboard &&
        dashboard.style.display!=="none";

    entries.forEach(entry=>{
        const article=document.createElement("article");
        article.className="guest-post";

        const name=document.createElement("div");
        name.className="guest-post-name";
        name.textContent=entry.name;

        const message=document.createElement("div");
        message.className="guest-post-message";
        message.textContent=entry.msg;

        const date=document.createElement("div");
        date.className="guest-post-date";
        date.textContent=entry.ts
            ?new Date(entry.ts).toLocaleString("es-EC")
            :"";

        article.append(name,message,date);

        if(canDelete){
            const remove=document.createElement("button");

            remove.className="admin-button admin-danger";
            remove.textContent="ELIMINAR FIRMA";
            remove.style.marginTop="12px";

            remove.addEventListener("click",async()=>{
                if(
                    !currentUser ||
                    currentUser.uid!==ADMIN_UID ||
                    document.getElementById("admin-screen").style.display!=="block"
                ){
                    alert("No tienes permisos para eliminar firmas.");
                    return;
                }

                if(!confirm("¿Eliminar esta firma?"))return;

                remove.disabled=true;

                try{
                    await database.ref("guestbook/"+entry.id).remove();

                }catch(error){
                    console.error("Error eliminando firma:",error);
                    alert("No se pudo eliminar: "+error.message);
                    remove.disabled=false;
                }
            });

            article.appendChild(remove);
        }

        list.appendChild(article);
    });

/* CONTENIDO HTML SEGURO */

function validHexColor(value){
    return typeof value==="string"&&/^#[0-9a-fA-F]{6}$/.test(value);
}

function safeInlineColor(value){
    if(typeof value!=="string")return "";
    if(/^#[0-9a-fA-F]{6}$/.test(value))return value;

    const rgb=value.match(/^rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/i);
    if(!rgb)return "";

    const channels=rgb.slice(1).map(Number);
    if(channels.some(channel=>channel<0||channel>255))return "";
    return `rgb(${channels.join(",")})`;
}

function safeHtml(html){
    const parser=new DOMParser();
    const doc=parser.parseFromString(String(html||""),"text/html");
    const allowed=["P","BR","B","STRONG","I","EM","U","A","SPAN","UL","OL","LI","IMG"];

    function clean(parent){
        [...parent.childNodes].forEach(node=>{
            if(node.nodeType===Node.TEXT_NODE)return;

            if(node.nodeType!==Node.ELEMENT_NODE){
                node.remove();
                return;
            }

            if(!allowed.includes(node.tagName)){
                const children=[...node.childNodes];
                node.replaceWith(...children);

                children.forEach(child=>{
                    if(child.nodeType===Node.ELEMENT_NODE)clean(child);
                });

                return;
            }

            if(node.tagName==="IMG"){
                const rawSrc=node.getAttribute("src")||"";
                let imageUrl;

                try{
                    imageUrl=new URL(rawSrc,location.href);
                }catch(e){
                    node.remove();
                    return;
                }

                if(!["http:","https:"].includes(imageUrl.protocol)){
                    node.remove();
                    return;
                }

                const alt=node.getAttribute("alt")||"Imagen";

                [...node.attributes].forEach(attr=>node.removeAttribute(attr.name));

                node.setAttribute("src",imageUrl.href);
                node.setAttribute("alt",alt.slice(0,200));
                node.setAttribute("loading","lazy");
                node.setAttribute("referrerpolicy","no-referrer");

                return;
            }

            const savedColor=(node.tagName==="A"||node.tagName==="SPAN")
                ?(node.style.color||"")
                :"";

            [...node.attributes].forEach(attr=>{
                const name=attr.name.toLowerCase();
                const keepLinkAttribute=node.tagName==="A"&&["href","target","rel"].includes(name);
                const keepColorStyle=(node.tagName==="A"||node.tagName==="SPAN")&&name==="style";
                if(!keepLinkAttribute&&!keepColorStyle)node.removeAttribute(attr.name);
            });

            node.removeAttribute("style");
            const safeColor=safeInlineColor(savedColor);
            if(safeColor)node.style.color=safeColor;

            if(node.tagName==="A"){
                try{
                    const url=new URL(node.getAttribute("href"),location.href);

                    if(!["http:","https:","mailto:"].includes(url.protocol)){
                        const children=[...node.childNodes];
                        node.replaceWith(...children);

                        children.forEach(child=>{
                            if(child.nodeType===Node.ELEMENT_NODE)clean(child);
                        });

                        return;
                    }

                    node.setAttribute("href",url.href);
                    node.setAttribute("target","_blank");
                    node.setAttribute("rel","noopener noreferrer");

                }catch(e){
                    const children=[...node.childNodes];
                    node.replaceWith(...children);

                    children.forEach(child=>{
                        if(child.nodeType===Node.ELEMENT_NODE)clean(child);
                    });

                    return;
                }
            }

            clean(node);
        });
    }

    clean(doc.body);
    return doc.body.innerHTML;
}

/* DETECTAR IMÁGENES */

function isImageUrl(rawUrl){
    try{
        const url=new URL(rawUrl);
        return /\.(avif|bmp|gif|jpe?g|png|svg|webp)$/i.test(url.pathname);
    }catch(e){
        return false;
    }
}

/* MOSTRAR CATEGORÍAS */

async function showCategory(section,title,description){
    closeMenus();

    saveData("gardenCategory",JSON.stringify({
        section,title,description
    }));

    if(section==="HOME"&&title==="Libro de visitas"){
        showGuestbook();
        return;
    }

    if(guestbookListener){
        guestbookListener.off("value");
        guestbookListener=null;
        latestGuestbookSnapshot=null;
    }

    const content=document.getElementById("content-area");
    const token=++currentContentToken;

    content.innerHTML="";

    const desc=document.createElement("p");
    desc.className="content-description";
    desc.textContent=description;

    if(section!=="INICIO"){
        const heading=document.createElement("h2");
        heading.className="content-title";
        heading.textContent=title;
        content.append(heading,desc);
    }else{
        content.appendChild(desc);
    }

    const loading=document.createElement("p");
    loading.className="admin-status";
    loading.textContent="Consultando registros...";
    content.appendChild(loading);

    try{
        const [snapshot,files]=await Promise.all([
            firestore.collection("publicaciones")
                .where("menu","==",section)
                .where("category","==",title)
                .get(),
            firestore.collection("archivos")
                .where("menu","==",section)
                .where("category","==",title)
                .get()
        ]);

        if(token!==currentContentToken)return;

        const docs=[];

        snapshot.forEach(doc=>{
            docs.push({id:doc.id,...doc.data()});
        });

        const orderedPublications=sortRecords(docs);

        loading.remove();

        orderedPublications.forEach(item=>{
            const article=document.createElement("article");
            article.className="publication";

            const h=document.createElement("h3");
            h.textContent=item.title||"Sin título";
            if(validHexColor(item.titleColor))h.style.color=item.titleColor;

            const body=document.createElement("div");
            body.className="publication-body";
            body.innerHTML=safeHtml(item.bodyHtml||"");

            article.append(h,body);
            content.appendChild(article);
        });

        const matchingFiles=[];

        files.forEach(doc=>{
            matchingFiles.push({id:doc.id,...doc.data()});
        });

        const orderedFiles=sortRecords(matchingFiles);

        orderedFiles.forEach(item=>{
            const article=document.createElement("article");
            article.className="publication";

            const h=document.createElement("h3");
            h.textContent=item.title||"Archivo";

            const p=document.createElement("p");
            p.className="publication-body";
            p.textContent=item.description||"";

            article.append(h,p);

            if(isImageUrl(item.url||"")){
                const img=document.createElement("img");
                img.className="file-image";
                img.src=item.url;
                img.alt=item.title||"Imagen";
                img.loading="lazy";
                img.referrerPolicy="no-referrer";

                img.onerror=()=>{
                    img.remove();

                    const a=document.createElement("a");
                    a.href=item.url;
                    a.target="_blank";
                    a.rel="noopener noreferrer";
                    a.textContent=item.linkLabel||"Abrir archivo";

                    article.appendChild(a);
                };

                article.appendChild(img);

            }else{
                const a=document.createElement("a");
                a.href=item.url||"#";
                a.target="_blank";
                a.rel="noopener noreferrer";
                a.textContent=item.linkLabel||"Abrir archivo";

                article.appendChild(a);
            }

            content.appendChild(article);
        });

        if(!docs.length&&!matchingFiles.length){
            const empty=document.createElement("p");
            empty.className="admin-status";
            empty.textContent="No hay publicaciones en esta sección.";
            content.appendChild(empty);
        }

    }catch(error){
        console.error("Error cargando contenido:",error);

        if(token===currentContentToken){
            loading.textContent="No se pudo cargar el contenido. Comprueba las reglas de Firestore.";
        }
    }
}

/* CARTA DE ENTRADA */

function typeWriter(){
    if(typingStarted)return;

    typingStarted=true;

    const message=messages[Math.floor(Math.random()*messages.length)]+signature;
    const textElement=document.getElementById("typed-text");
    const cursor=document.getElementById("cursor");
    let index=0;

    function type(){
        if(index<message.length){
            const character=message.charAt(index);

            textElement.textContent+=character;
            index++;

            setTimeout(type,character==="\n"?350:32);

        }else{
            cursor.style.display="none";
            setTimeout(showHomeScreen,2500);
        }
    }

    type();
}

function showHomeScreen(){
    if(transitionStarted)return;

    transitionStarted=true;

    const letter=document.getElementById("letter-screen");
    const home=document.getElementById("home-screen");

    letter.style.opacity="0";

    setTimeout(()=>{
        letter.style.display="none";
        home.style.display="block";

        setTimeout(()=>home.style.opacity="1",100);

        saveData("gardenEntered","yes");
        showInicio();

    },1500);
}

function initializePage(){
    typingStarted=false;
    transitionStarted=false;

    const letter=document.getElementById("letter-screen");
    const home=document.getElementById("home-screen");

    // La carta aparece una sola vez en este navegador. Después, se entra directo a la portada.
    if(getSaved("gardenEntered")==="yes"){
        letter.style.display="none";
        letter.style.opacity="0";
        home.style.display="block";
        home.style.opacity="1";
        showInicio();
        return;
    }

    letter.style.display="flex";
    home.style.display="none";
    home.style.opacity="0";
    typeWriter();
}

/* SELECTORES DE MENÚ Y CATEGORÍA */

function menuOptions(selected="INICIO"){
    return Object.keys(sections).map(key=>
        `<option value="${key}" ${key===selected?"selected":""}>${key}</option>`
    ).join("");
}

function categoryOptions(menu,selected=""){
    return sections[menu]
        .filter(item=>!(menu==="HOME"&&item.title==="Libro de visitas"))
        .map(item=>
            `<option value="${item.title}" ${item.title===selected?"selected":""}>${item.title}</option>`
        ).join("");
}

function fillCategorySelect(menuSelect,categorySelect,selected=""){
    categorySelect.innerHTML=categoryOptions(menuSelect.value,selected);
}

function addLocationSelectors(menuValue="INICIO",categoryValue="Portada"){
    return `
    <label class="admin-status">MENÚ DONDE SE PUBLICARÁ</label>
    <select class="admin-select" id="record-menu">${menuOptions(menuValue)}</select>

    <label class="admin-status">CATEGORÍA</label>
    <select class="admin-select" id="record-category">${categoryOptions(menuValue,categoryValue)}</select>`;
}

        <button type="button" id="apply-text-color">APLICAR A SELECCIÓN</button>
    </div>

    <div class="editor-help">Selecciona una palabra, frase o fragmento y elige un color. Solo cambiará el texto seleccionado, incluso si está dentro de un enlace. Para cambiar el título completo, usa el selector de color del título.</div>
    <div class="editor-help">Para insertar un enlace o una imagen, coloca el cursor donde quieras añadirlo. Para los enlaces, selecciona primero una palabra o frase. Para las imágenes, introduce una URL directa de imagen (JPG, PNG, GIF o WEBP).</div>

    <div class="rich-editor" id="rich-editor" contenteditable="true" spellcheck="true"></div>`;

function setupEditor(initialHtml=""){
    const editor=document.getElementById("rich-editor");

    editor.innerHTML=safeHtml(initialHtml);
    savedEditorRange=null;

    function saveSelection(){
        const selection=window.getSelection();

        if(!selection||selection.rangeCount===0)return;

        const range=selection.getRangeAt(0);

        if(editor.contains(range.commonAncestorContainer)){
            savedEditorRange=range.cloneRange();
        }
    }

    editor.addEventListener("keyup",saveSelection);
    editor.addEventListener("mouseup",saveSelection);
    editor.addEventListener("touchend",()=>setTimeout(saveSelection,100));

    document.addEventListener("selectionchange",()=>{
        saveSelection();
    });

    function restoreSelection(){
        if(!savedEditorRange)return false;

        try{
            editor.focus();

            const selection=window.getSelection();
            selection.removeAllRanges();
            selection.addRange(savedEditorRange);

            return true;

        }catch(error){
            return false;
        }
    }

    document.querySelectorAll("[data-command]").forEach(button=>{
        button.addEventListener("mousedown",event=>event.preventDefault());

        button.addEventListener("click",()=>{
            restoreSelection();
            editor.focus();

            document.execCommand(button.dataset.command,false,null);

            saveSelection();
        });
    });

    const insertButton=document.getElementById("insert-link");

    insertButton.addEventListener("mousedown",event=>event.preventDefault());

    insertButton.addEventListener("click",()=>{
        if(!restoreSelection()){
            alert("Primero selecciona la palabra o frase que quieres convertir en enlace.");
            return;
        }

        const selection=window.getSelection();

        if(!selection||selection.isCollapsed){
            alert("Primero selecciona la palabra o frase que quieres convertir en enlace.");
            return;
        }

        const raw=prompt("Introduce la dirección del enlace (https://...)");

        if(!raw)return;

        let url;

        try{
            url=new URL(raw.trim());

        }catch(e){
            alert("La dirección no es válida.");
            return;
        }

        if(!["http:","https:","mailto:"].includes(url.protocol)){
            alert("Solo se permiten enlaces http, https o mailto.");
            return;
        }

        editor.focus();
        restoreSelection();

        document.execCommand("createLink",false,url.href);

        editor.querySelectorAll("a").forEach(a=>{
            a.target="_blank";
            a.rel="noopener noreferrer";
        });

        saveSelection();
    });

    const removeButton=document.getElementById("remove-link");

    removeButton.addEventListener("mousedown",event=>event.preventDefault());

    removeButton.addEventListener("click",()=>{
        restoreSelection();
        editor.focus();

        document.execCommand("unlink",false,null);

        saveSelection();
    });

    const colorButton=document.getElementById("apply-text-color");
    const colorInput=document.getElementById("editor-text-color");

    colorButton.addEventListener("mousedown",event=>event.preventDefault());
    colorButton.addEventListener("click",()=>{
        const color=colorInput.value;

        if(!validHexColor(color))return;
        if(!restoreSelection()){
            alert("Primero selecciona una palabra, frase o fragmento dentro del texto.");
            return;
        }

        const selection=window.getSelection();
        if(!selection||selection.isCollapsed){
            alert("Primero selecciona el texto al que quieres cambiar el color.");
            return;
        }

        const range=selection.getRangeAt(0);
        if(!editor.contains(range.commonAncestorContainer))return;

        const walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT);
        const textNodes=[];
        while(walker.nextNode()){
            const node=walker.currentNode;
            if(node.nodeValue&&node.nodeValue.length&&range.intersectsNode(node))textNodes.push(node);
        }

        const coloredSpans=[];
        textNodes.forEach(node=>{
            const originalLength=node.nodeValue.length;
            let start=node===range.startContainer?range.startOffset:0;
            let end=node===range.endContainer?range.endOffset:originalLength;
            start=Math.max(0,Math.min(start,originalLength));
            end=Math.max(0,Math.min(end,originalLength));
            if(end<=start)return;

            let selectedNode=node;
            if(start>0)selectedNode=selectedNode.splitText(start);
            if(end-start<selectedNode.nodeValue.length)selectedNode.splitText(end-start);

            const span=document.createElement("span");
            span.style.color=color;
            selectedNode.parentNode.insertBefore(span,selectedNode);
            span.appendChild(selectedNode);
            coloredSpans.push(span);
        });

        if(!coloredSpans.length){
            alert("No se pudo aplicar el color a esa selección.");
            return;
        }

        const newRange=document.createRange();
        newRange.setStartBefore(coloredSpans[0]);
        newRange.setEndAfter(coloredSpans[coloredSpans.length-1]);
        selection.removeAllRanges();
        selection.addRange(newRange);
        savedEditorRange=newRange.cloneRange();
        editor.focus({preventScroll:true});
    });

    const imageButton=document.getElementById("insert-image");

    imageButton.addEventListener("mousedown",event=>event.preventDefault());

    imageButton.addEventListener("click",()=>{
        restoreSelection();

        const raw=prompt("Pega la dirección directa de la imagen (https://...)");

        if(!raw)return;

        let url;

        try{
            url=new URL(raw.trim());

        }catch(e){
            alert("La dirección no es válida.");
            return;
        }

        if(!["http:","https:"].includes(url.protocol)){
            alert("Solo se permiten direcciones http o https.");
            return;
        }

        if(!/\.(avif|bmp|gif|jpe?g|png|svg|webp)$/i.test(url.pathname)){
            const proceed=confirm("La dirección no termina en una extensión de imagen conocida. ¿Quieres intentar insertarla de todas formas?");
            if(!proceed)return;
        }

        editor.focus();
        restoreSelection();

        const img=document.createElement("img");

        img.src=url.href;
        img.alt="Imagen";
        img.loading="lazy";
        img.referrerPolicy="no-referrer";

        const selection=window.getSelection();

        if(selection&&selection.rangeCount){
            const range=selection.getRangeAt(0);

            range.deleteContents();
            range.insertNode(img);

            const space=document.createTextNode(" ");
            img.after(space);

            range.setStartAfter(space);
            range.collapse(true);

            selection.removeAllRanges();
            selection.addRange(range);

        }else{
            editor.appendChild(img);
        }

        savedEditorRange=null;
        saveSelection();
    });
}

/* PUBLICACIONES */

function renderPublicationEditor(editData=null){
    const panel=document.getElementById("admin-panel-content");

    const menu=editData?.menu||"INICIO";
    const category=editData?.category||(menu==="INICIO"?"Portada":"Manifestación");

    panel.innerHTML=`
    <div class="admin-box">
        <p class="admin-subtitle">${editData?"EDITAR PUBLICACIÓN":"NUEVA PUBLICACIÓN"}</p>

        ${addLocationSelectors(menu,category)}

        <label class="admin-status">TÍTULO</label>
        <input class="admin-input" id="record-title" maxlength="120" placeholder="Título de la publicación">
        <div class="title-color-row">
            <label for="record-title-color">COLOR DE ESTE TÍTULO</label>
            <input class="title-color-input" type="color" id="record-title-color" value="#cccccc" aria-label="Color del título">
        </div>

        <label class="admin-status">CONTENIDO</label>
        ${editorToolbar()}

        <div class="admin-actions">
            <button class="admin-button" id="record-save">${editData?"GUARDAR CAMBIOS":"PUBLICAR"}</button>
            <button class="admin-button" id="record-cancel">CANCELAR</button>
        </div>

        <p class="admin-status" id="record-status"></p>
    </div>

    <div class="admin-box">
        <p class="admin-subtitle">PUBLICACIONES EXISTENTES</p>
        <p class="admin-hint">Usa ↑ y ↓ para cambiar la posición de una publicación dentro de su categoría.</p>
        <div id="record-list" class="admin-status">Cargando...</div>
    </div>`;

    const menuSelect=document.getElementById("record-menu");
    const categorySelect=document.getElementById("record-category");

    menuSelect.addEventListener("change",()=>{
        fillCategorySelect(menuSelect,categorySelect);
    });

    setupEditor(editData?.bodyHtml||"");

    if(editData){
        document.getElementById("record-title").value=editData.title||"";
        document.getElementById("record-title-color").value=validHexColor(editData.titleColor)?editData.titleColor:"#cccccc";
    }

    document.getElementById("record-cancel").addEventListener("click",()=>{
        editingId=null;
        renderPublicationEditor();
    });

    document.getElementById("record-save").addEventListener("click",async()=>{
        const title=document.getElementById("record-title").value.trim();
        const titleColor=document.getElementById("record-title-color").value;
        const editor=document.getElementById("rich-editor");
        const bodyHtml=safeHtml(editor.innerHTML);
        const status=document.getElementById("record-status");
        const saveButton=document.getElementById("record-save");

        if(!title||!editor.textContent.trim()&&!editor.querySelector("img")){
            status.textContent="Escribe un título y contenido o inserta una imagen.";
            return;
        }

        saveButton.disabled=true;
        status.textContent="Guardando publicación...";

        const newMenu=menuSelect.value;
        const newCategory=categorySelect.value;

        const sameLocation=editData&&
            editData.menu===newMenu&&
            editData.category===newCategory;

        const data={
            menu:newMenu,
            category:newCategory,
            title,
            titleColor:validHexColor(titleColor)?titleColor:"#cccccc",
            bodyHtml,
            updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        };

        try{
            if(editingId){
                if(sameLocation&&hasCustomOrder(editData)){
                    data.order=editData.order;

                }else{
                    data.order=await prepareNextOrder(
                        "publicaciones",
                        newMenu,
                        newCategory,
                        editingId
                    );
                }

                await firestore.collection("publicaciones").doc(editingId).update(data);

                status.textContent="Publicación actualizada.";

            }else{
                data.order=await prepareNextOrder(
                    "publicaciones",
                    newMenu,
                    newCategory
                );

                data.createdAt=firebase.firestore.FieldValue.serverTimestamp();

                await firestore.collection("publicaciones").add(data);

                status.textContent="Publicación creada.";
            }

            editingId=null;

            document.getElementById("record-title").value="";
            editor.innerHTML="";
            savedEditorRange=null;

            saveButton.textContent="PUBLICAR";

            await loadPublicationList();

        }catch(error){
            console.error(error);
            status.textContent="No se pudo guardar. Comprueba las reglas de Firestore.";

        }finally{
            saveButton.disabled=false;
        }
    });

    loadPublicationList();
}

async function loadPublicationList(){
    const list=document.getElementById("record-list");

    if(!list)return;

    try{
        const snapshot=await firestore.collection("publicaciones").get();

        if(!document.getElementById("record-list"))return;

        list.innerHTML="";

        if(snapshot.empty){
            list.textContent="No hay publicaciones todavía.";
            return;
        }

        const docs=[];

        snapshot.forEach(doc=>{
            docs.push({id:doc.id,...doc.data()});
        });

        docs.sort((a,b)=>{
            const groupA=(a.menu||"")+"|"+(a.category||"");
            const groupB=(b.menu||"")+"|"+(b.category||"");

            if(groupA!==groupB)return groupA.localeCompare(groupB);

            return compareRecords(a,b);
        });

        const groupPositions={};

        docs.forEach(item=>{
            const groupKey=(item.menu||"")+"|"+(item.category||"");

            if(!groupPositions[groupKey]){
                groupPositions[groupKey]=sortRecords(
                    docs.filter(record=>
                        record.menu===item.menu&&
                        record.category===item.category
                    )
                );
            }

            const group=groupPositions[groupKey];
            const position=group.findIndex(record=>record.id===item.id);

            const row=document.createElement("div");
            row.className="admin-record";

            const label=document.createElement("span");
            label.textContent=`${item.menu||""} / ${item.category||""} — ${item.title||"Sin título"}`;

            const actions=document.createElement("div");
            actions.className="admin-actions";

            const up=document.createElement("button");
            up.className="move-button";
            up.textContent="↑";
            up.title="Mover hacia arriba";
            up.disabled=position===0;

            up.addEventListener("click",()=>{
                moveRecord("publicaciones",group,position,-1,loadPublicationList);
            });

            const down=document.createElement("button");
            down.className="move-button";
            down.textContent="↓";
            down.title="Mover hacia abajo";
            down.disabled=position===group.length-1;

            down.addEventListener("click",()=>{
                moveRecord("publicaciones",group,position,1,loadPublicationList);
            });

            const edit=document.createElement("button");
            edit.textContent="EDITAR";

            edit.addEventListener("click",()=>{
                editingId=item.id;
                renderPublicationEditor(item);
            });

            const remove=document.createElement("button");
            remove.textContent="ELIMINAR";
            remove.className="admin-danger";

            remove.addEventListener("click",async()=>{
                if(!confirm("¿Eliminar esta publicación?"))return;

                try{
                    await firestore.collection("publicaciones").doc(item.id).delete();
                    loadPublicationList();

                }catch(error){
                    console.error(error);
                    alert("No se pudo eliminar.");
                }
            });

            actions.append(up,down,edit,remove);
            row.append(label,actions);
            list.appendChild(row);
        });

    }catch(error){
        console.error(error);
        list.textContent="No se pudieron cargar las publicaciones. Revisa las reglas de Firestore.";
    }
}

        saveButton.disabled=true;
        status.textContent="Guardando archivo...";

        const newMenu=menuSelect.value;
        const newCategory=categorySelect.value;

        const sameLocation=editData&&
            editData.menu===newMenu&&

            category:newCategory,
            title,

            url:url.href,

                    newMenu,
                    newCategory

                status.textContent="Archivo añadido.";

            document.getElementById("file-title").value="";
            document.getElementById("file-description").value="";
            document.getElementById("file-url").value="";
            document.getElementById("file-label").value="";

            console.error(error);
            status.textContent="No se pudo guardar. Comprueba las reglas de Firestore.";

        }finally{
            saveButton.disabled=false;
        }
    });

    loadFileList();

            remove.className="admin-danger";

            remove.addEventListener("click",async()=>{
                if(!confirm("¿Eliminar este archivo?"))return;

                try{
                    await firestore.collection("archivos").doc(item.id).delete();
                    loadFileList();

                }catch(error){
                    console.error(error);
                    alert("No se pudo eliminar.");
                }
            });

            actions.append(up,down,edit,remove);
            row.append(label,actions);
            list.appendChild(row);
        });

    }catch(error){
        console.error(error);
        list.textContent="No se pudieron cargar los archivos. Revisa las reglas de Firestore.";
    }
}

/* CONFIGURACIÓN */

function renderConfiguration(){
    const panel=document.getElementById("admin-panel-content");

    panel.innerHTML=`
    <div class="admin-box">
        <p class="admin-subtitle">OTRAS CONFIGURACIONES</p>
        <p class="admin-hint">Los colores se ajustan individualmente al editar cada publicación: el título tiene su propio selector y el contenido permite colorear solo el texto seleccionado.</p>
        <input class="admin-input" id="config-key" placeholder="Nombre de la opción">
        <textarea class="admin-textarea" id="config-value" placeholder="Valor"></textarea>
        <button class="admin-button" id="config-save">GUARDAR CONFIGURACIÓN</button>
        <p class="admin-status" id="config-status"></p>
        <div id="config-list" class="admin-status">Cargando...</div>
    </div>`;

    loadConfig();

    document.getElementById("config-save").addEventListener("click",async()=>{
        const key=document.getElementById("config-key").value.trim();
        const value=document.getElementById("config-value").value.trim();
        const status=document.getElementById("config-status");

        if(!key||!value){
            status.textContent="Completa ambos campos.";
            return;
        }

        try{
            await firestore.collection("configuracion").doc(key).set({
                value,
                updatedAt:firebase.firestore.FieldValue.serverTimestamp()
            });
            status.textContent="Configuración guardada.";
            loadConfig();
        }catch(error){
            console.error(error);
            status.textContent="No se pudo guardar. Revisa las reglas de Firestore.";
        }
    });
}

async function loadConfig(){
    const list=document.getElementById("config-list");

    if(!list)return;

    try{
        const snapshot=await firestore.collection("configuracion").get();

        if(!document.getElementById("config-list"))return;

        list.innerHTML="";

        if(snapshot.empty){
            list.textContent="No hay opciones guardadas.";
            return;
        }

        snapshot.forEach(doc=>{
            if(doc.id.startsWith("__colores"))return;
            const row=document.createElement("div");
            row.className="admin-record";

            const label=document.createElement("span");
            label.textContent=doc.id+": "+(doc.data().value||"");

            const remove=document.createElement("button");
            remove.textContent="ELIMINAR";

            remove.addEventListener("click",async()=>{
                if(!confirm("¿Eliminar esta configuración?"))return;

                try{
                    await firestore.collection("configuracion").doc(doc.id).delete();
                    loadConfig();

                }catch(error){
                    console.error(error);
                    alert("No se pudo eliminar.");
                }
            });

            row.append(label,remove);
            list.appendChild(row);
        });

    }catch(error){
        console.error(error);
        list.textContent="No se pudo cargar la configuración. Revisa las reglas de Firestore.";
    }
}

/* INICIO */

initializePage();

}
</script>
