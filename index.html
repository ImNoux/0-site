async function loadPublicationList(keepOpenState=null){
    const list=document.getElementById("gestor-publication-list");
    if(!list)return;
    const openSections=new Set();
    const openCategories=new Set();
    if(keepOpenState){
        keepOpenState.sections.forEach(s=>openSections.add(s));
        keepOpenState.categories.forEach(c=>openCategories.add(c));
    }else{
        list.querySelectorAll("details.publication-group[open]").forEach(el=>{
            if(el.dataset.section)openSections.add(el.dataset.section);
        });
        list.querySelectorAll("details.publication-category[open]").forEach(el=>{
            if(el.dataset.key)openCategories.add(el.dataset.key);
        });
    }
    if(gestorTargetLocation){
        openSections.add(gestorTargetLocation.section);
        openCategories.add(gestorTargetLocation.section+"::"+gestorTargetLocation.category);
        gestorTargetLocation=null;
    }
    try{
        const snapshot=await legacyCollection("publicaciones").get();
        if(!document.getElementById("gestor-publication-list"))return;
        list.innerHTML="";
        if(snapshot.empty){list.textContent="No hay publicaciones todavía.";return;}
        const docs=[];snapshot.forEach(doc=>docs.push({id:doc.id,...doc.data()}));
        const sectionsOrder=["INICIO","HOME","SHA","SEC","OBL","ARC"];
        const categories={};
        docs.forEach(item=>{
            const section=item.menu||"SIN SECCIÓN";const category=item.category||"Sin categoría";
            categories[section]??={};categories[section][category]??=[];categories[section][category].push(item);
        });
        [...new Set([...sectionsOrder,...Object.keys(categories)])].forEach(section=>{
            if(!categories[section])return;
            const sectionBox=document.createElement("details");sectionBox.className="publication-group";
            sectionBox.dataset.section=section;
            if(openSections.has(section))sectionBox.open=true;
            const sectionTitle=document.createElement("summary");sectionTitle.textContent=section;sectionBox.appendChild(sectionTitle);
            Object.keys(categories[section]).sort((a,b)=>a.localeCompare(b)).forEach(category=>{
                const categoryBox=document.createElement("details");categoryBox.className="publication-category";
                const catKey=section+"::"+category;
                categoryBox.dataset.key=catKey;
                if(openCategories.has(catKey))categoryBox.open=true;
                const isHiddenCat=(sections[section]||[]).find(c=>c.title===category)?.hidden;
                const categoryTitle=document.createElement("summary");
                categoryTitle.textContent=category+(isHiddenCat?" [OCULTA]":"");
                categoryBox.appendChild(categoryTitle);
                sortRecords(categories[section][category]).forEach(item=>{
                    const row=document.createElement("div");row.className="admin-record";
                    const label=document.createElement("span");label.textContent=item.title||"Sin título";
                    const actions=document.createElement("div");actions.className="admin-actions";
                    const ordered = sortRecords(categories[section][category]);
                    const pos = ordered.findIndex(r => r.id === item.id);

                    const up=document.createElement("button");
                    up.className="move-button";
                    up.textContent="↑";
                    up.title="Subir";
                    up.disabled = pos === 0;
                    up.addEventListener("click", () => {
                        moveRecord("publicaciones", ordered, pos, -1, loadPublicationList);
                    });

                    const down=document.createElement("button");
                    down.className="move-button";
                    down.textContent="↓";
                    down.title="Bajar";
                    down.disabled = pos === ordered.length - 1;
                    down.addEventListener("click", () => {
                        moveRecord("publicaciones", ordered, pos, 1, loadPublicationList);
                    });

                    const edit=document.createElement("button");edit.textContent="EDITAR";
                    edit.addEventListener("click",()=>{
                        editingId=item.id;
                        document.querySelectorAll(".admin-tab").forEach(button=>button.classList.toggle("active",button.dataset.adminTab==="contenido"));
                        localStorage.setItem("0site_admin_tab","contenido");
                        renderPublicationEditor(item);
                    });
                    const remove=document.createElement("button");remove.textContent="ELIMINAR";remove.className="admin-danger";
                    remove.addEventListener("click",async()=>{
                        if(!confirm("¿Eliminar esta publicación definitivamente?"))return;
                        try{await legacyCollection("publicaciones").doc(item.id).delete();await loadPublicationList();}
                        catch(error){console.error(error);alert("No se pudo eliminar. Comprueba las reglas de Firestore.");}
                    });
                    actions.append(up, down, edit, remove);row.append(label,actions);categoryBox.appendChild(row);
                });
                sectionBox.appendChild(categoryBox);
            });
            list.appendChild(sectionBox);
        });
    }catch(error){console.error(error);list.textContent="No se pudieron cargar las publicaciones. Revisa las reglas de Firestore.";}
}

function renderFileEditor(editData=null){
    const panel=document.getElementById("admin-panel-content");

    const menu=editData?.menu&&editData.menu!=="INICIO"?editData.menu:"HOME";
    const category=editData?.menu!=="INICIO"&&editData?.category?editData.category:"Entrada";

    panel.innerHTML=`
    <div class="admin-box">
        <p class="admin-subtitle">${editData?"EDITAR ARCHIVO":"AÑADIR ARCHIVO"}</p>

        ${addLocationSelectors(menu,category)}

        <label class="admin-status">NOMBRE DEL ARCHIVO</label>
        <input class="admin-input" id="file-title" placeholder="Nombre o título">

        <label class="admin-status">DESCRIPCIÓN</label>
        <textarea class="admin-textarea" id="file-description" placeholder="Descripción breve"></textarea>

        <label class="admin-status">DIRECCIÓN DEL ARCHIVO</label>
        <input class="admin-input" id="file-url" type="url" placeholder="https://...">

        <label class="admin-status">TEXTO DEL ENLACE</label>
        <input class="admin-input" id="file-label" placeholder="Abrir archivo">

        <p class="admin-hint">Si la dirección corresponde a una imagen JPG, PNG, GIF, WEBP, AVIF o SVG, se mostrará directamente. Los demás archivos conservarán el enlace.</p>

        <div class="admin-actions">
            <button class="admin-button" id="file-save">${editData?"GUARDAR CAMBIOS":"AÑADIR ARCHIVO"}</button>
            <button class="admin-button" id="file-cancel">CANCELAR</button>
        </div>

        <p class="admin-status" id="file-status"></p>
    </div>

    <div class="admin-box">
        <p class="admin-subtitle">ARCHIVOS EXISTENTES</p>
        <p class="admin-hint">Usa ↑ y ↓ para cambiar la posición de un archivo dentro de su categoría.</p>
        <div id="file-list" class="admin-status">Cargando...</div>
    </div>`;

    const menuSelect=document.getElementById("record-menu");
    const categorySelect=document.getElementById("record-category");

    menuSelect.addEventListener("change",()=>fillCategorySelect(menuSelect,categorySelect));

    if(editData){
        document.getElementById("file-title").value=editData.title||"";
        document.getElementById("file-description").value=editData.description||"";
        document.getElementById("file-url").value=editData.url||"";
        document.getElementById("file-label").value=editData.linkLabel||"Abrir archivo";
    }

    document.getElementById("file-cancel").addEventListener("click",()=>{
        editingId=null;
        renderFileEditor();
    });

    document.getElementById("file-save").addEventListener("click",async()=>{
        const title=document.getElementById("file-title").value.trim();
        const description=document.getElementById("file-description").value.trim();
        const rawUrl=document.getElementById("file-url").value.trim();
        const linkLabel=document.getElementById("file-label").value.trim()||"Abrir archivo";

        const status=document.getElementById("file-status");
        const saveButton=document.getElementById("file-save");

        let url;

        try{
            url=new URL(rawUrl);

        }catch(e){
            status.textContent="Introduce una dirección válida.";
            return;
        }

        if(!["http:","https:"].includes(url.protocol)){
            status.textContent="Solo se permiten enlaces http o https.";
            return;
        }

        if(!title){
            status.textContent="Escribe un nombre para el archivo.";
            return;
        }

        saveButton.disabled=true;
        status.textContent="Guardando archivo...";

        const newMenu=menuSelect.value;
        const newCategory=categorySelect.value;

        const sameLocation=editData&&
            editData.menu===newMenu&&
            editData.category===newCategory;

        const data={
            menu:newMenu,
            category:newCategory,
            title,
            description,
            url:url.href,
            linkLabel,
            updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        };

        try{
            if(editingId){
                if(sameLocation&&hasCustomOrder(editData)){
                    data.order=editData.order;

                }else{
                    data.order=await prepareNextOrder(
                        "archivos",
                        newMenu,
                        newCategory,
                        editingId
                    );
                }

                await legacyCollection("archivos").doc(editingId).update(data);

                status.textContent="Archivo actualizado.";

            }else{
                data.order=await prepareNextOrder(
                    "archivos",
                    newMenu,
                    newCategory
                );

                data.createdAt=firebase.firestore.FieldValue.serverTimestamp();

                await legacyCollection("archivos").add(data);

                status.textContent="Archivo añadido.";
            }

            editingId=null;

            document.getElementById("file-title").value="";
            document.getElementById("file-description").value="";
            document.getElementById("file-url").value="";
            document.getElementById("file-label").value="";

            saveButton.textContent="AÑADIR ARCHIVO";

            await loadFileList();

        }catch(error){
            console.error(error);
            status.textContent="No se pudo guardar. Comprueba las reglas de Firestore.";

        }finally{
            saveButton.disabled=false;
        }
    });

    loadFileList();
}

async function loadFileList(){
    const list=document.getElementById("file-list");

    if(!list)return;

    try{
        const snapshot=await legacyCollection("archivos").get();

        if(!document.getElementById("file-list"))return;

        list.innerHTML="";

        if(snapshot.empty){
            list.textContent="No hay archivos todavía.";
            return;
        }

        const items=[];

        snapshot.forEach(doc=>{
            items.push({id:doc.id,...doc.data()});
        });

        items.sort((a,b)=>{
            const groupA=(a.menu||"")+"|"+(a.category||"");
            const groupB=(b.menu||"")+"|"+(b.category||"");

            if(groupA!==groupB)return groupA.localeCompare(groupB);

            return compareRecords(a,b);
        });

        const groupPositions={};

        items.forEach(item=>{
            const groupKey=(item.menu||"")+"|"+(item.category||"");

            if(!groupPositions[groupKey]){
                groupPositions[groupKey]=sortRecords(
                    items.filter(record=>
                        record.menu===item.menu&&
                        record.category===item.category
                    )
                );
            }

            const group=groupPositions[groupKey];
            const position=group.findIndex(record=>record.id===item.id);

            const row=document.createElement("div");
            row.className="admin-record";

            const label=document.createElement("span");
            label.textContent=`${item.menu||""} / ${item.category||""} — ${item.title||"Archivo"}`;

            const actions=document.createElement("div");
            actions.className="admin-actions";

            const up=document.createElement("button");
            up.className="move-button";
            up.textContent="↑";
            up.title="Mover hacia arriba";
            up.disabled=position===0;

            up.addEventListener("click",()=>{
                moveRecord("archivos",group,position,-1,loadFileList);
            });

            const down=document.createElement("button");
            down.className="move-button";
            down.textContent="↓";
            down.title="Mover hacia abajo";
            down.disabled=position===group.length-1;

            down.addEventListener("click",()=>{
                moveRecord("archivos",group,position,1,loadFileList);
            });

            const edit=document.createElement("button");
            edit.textContent="EDITAR";

            edit.addEventListener("click",()=>{
                editingId=item.id;
                renderFileEditor(item);
            });

            const remove=document.createElement("button");
            remove.textContent="ELIMINAR";
            remove.className="admin-danger";

            remove.addEventListener("click",async()=>{
                if(!confirm("¿Eliminar este archivo?"))return;

                try{
                    await legacyCollection("archivos").doc(item.id).delete();
                    loadFileList();

                }catch(error){
                    console.error(error);
                    alert("No se pudo eliminar.");
                }
            });

            actions.append(up,down,edit,remove);
            row.append(label,actions);
            list.appendChild(row);
        });

    }catch(error){
        console.error(error);
        list.textContent="No se pudieron cargar los archivos. Revisa las reglas de Firestore.";
    }
}

    newCatInput.addEventListener("input",()=>{
        const slug=routeSlug(newCatInput.value);
        newCatPreview.textContent=slug?`Ruta del enlace: ${location.origin}/${slug}  (o ${slug} en el editor)`:"";
    });

    function drawCategoryDraft(){
        const menu=menuPicker.value;
        categoryList.innerHTML="";
        categoryDraft[menu].forEach((item,index)=>{
            const row=document.createElement("div");
            row.className="category-order-row";

            const name=document.createElement("input");
            name.className="admin-input";
            name.maxLength=60;
            name.value=item.title;
            name.title="Ruta: /"+routeSlug(item.title);
            name.setAttribute("aria-label","Nombre de categoría");
            name.addEventListener("input",()=>{
                item.title=name.value;
                name.title="Ruta: /"+routeSlug(item.title);
            });

            const hiddenLabel=document.createElement("label");
            hiddenLabel.className="category-hidden-toggle"+(item.hidden?" is-hidden":"");
            hiddenLabel.title="Si está marcada, no sale en los menús superiores y solo se abre por enlace /"+routeSlug(item.title);
            const hiddenCheck=document.createElement("input");
            hiddenCheck.type="checkbox";
            hiddenCheck.checked=Boolean(item.hidden);
            hiddenCheck.addEventListener("change",()=>{
                item.hidden=hiddenCheck.checked;
                hiddenLabel.classList.toggle("is-hidden",item.hidden);
            });
            hiddenLabel.append(hiddenCheck,document.createTextNode(" Oculta"));

            const up=document.createElement("button");
            up.type="button";up.textContent="↑";up.title="Subir";
            up.disabled=index===0;
            up.addEventListener("click",()=>{
                [categoryDraft[menu][index-1],categoryDraft[menu][index]]=[categoryDraft[menu][index],categoryDraft[menu][index-1]];
                drawCategoryDraft();
            });

            const down=document.createElement("button");
            down.type="button";down.textContent="↓";down.title="Bajar";
            down.disabled=index===categoryDraft[menu].length-1;
            down.addEventListener("click",()=>{
                [categoryDraft[menu][index+1],categoryDraft[menu][index]]=[categoryDraft[menu][index],categoryDraft[menu][index+1]];
                drawCategoryDraft();
            });

            const del=document.createElement("button");
            del.type="button";del.textContent="✕";del.title="Eliminar categoría";
            del.className="admin-danger";
            del.disabled=categoryDraft[menu].length<=1;
            del.addEventListener("click",()=>{
                if(!confirm(`¿Quitar la categoría "${item.title}"? (Recuerda pulsar GUARDAR CAMBIOS para confirmar)`))return;
                categoryDraft[menu].splice(index,1);
                drawCategoryDraft();
            });

            row.append(name,hiddenLabel,up,down,del);
            categoryList.appendChild(row);
        });
    }
    menuPicker.addEventListener("change",drawCategoryDraft);
    document.getElementById("add-category-button").addEventListener("click",()=>{
        const input=document.getElementById("new-category-name");
        const hiddenInput=document.getElementById("new-category-hidden");
        const title=input.value.trim();
        const isHidden=hiddenInput.checked;
        const menu=menuPicker.value;
        if(!title){categoryStatus.textContent="Escribe un nombre para la categoría.";return;}
        if(categoryDraft[menu].some(item=>item.title.toLowerCase()===title.toLowerCase())){
            categoryStatus.textContent="Esa categoría ya existe en este menú.";return;
        }
        categoryDraft[menu].push({title,description:"",hidden:isHidden});
        input.value="";
        hiddenInput.checked=false;
        newCatPreview.textContent="";
        const slug=routeSlug(title);
        categoryStatus.textContent=`Categoría añadida${isHidden?" (oculta)":""}. Ruta: /${slug} — Pulsa GUARDAR CAMBIOS para activarla.`;
        drawCategoryDraft();
    });
    document.getElementById("save-category-settings").addEventListener("click",async()=>{
        const invalid=Object.values(categoryDraft).some(list=>
            list.some(item=>!item.title.trim())||
            new Set(list.map(item=>item.title.trim().toLowerCase())).size!==list.length
        );
        if(invalid){categoryStatus.textContent="Revisa los nombres: no pueden estar vacíos ni repetidos.";return;}
        try{
            const clean={};
            Object.keys(categoryDraft).forEach(key=>{
                clean[key]=categoryDraft[key].map(item=>({
                    ...item,
                    title:item.title.trim(),
                    hidden:Boolean(item.hidden)
                }));
            });
            await legacyCollection("configuracion").doc("__categorias").set({
                sections:clean,
                updatedAt:firebase.firestore.FieldValue.serverTimestamp()
            });
            const categorySnapshot=await firestore.collection("categories").get();
            const categoryBatch=firestore.batch();
            const activeSlugs=new Set();
            Object.entries(clean).forEach(([menu,items])=>items.forEach((item,index)=>{
                const slug=categorySlug(item.title);activeSlugs.add(slug);
                categoryBatch.set(firestore.collection("categories").doc(slug),{
                    name:item.title,slug,section:normalizeSection(menu),published:!item.hidden,
                    hidden:Boolean(item.hidden),description:item.description||"",order:index,
                    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
                },{merge:true});
            }));
            categorySnapshot.docs.forEach(doc=>{
                const d=doc.data()||{};
                if(d.name&&!activeSlugs.has(doc.id))categoryBatch.set(doc.ref,{published:false,hidden:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
            });
            await categoryBatch.commit();
            applySectionSettings(clean);
            buildPublicMenus();
            categoryDraft=cloneSectionSettings();
            drawCategoryDraft();
            categoryStatus.textContent="Categorías, estados ocultos y orden guardados correctamente.";
        }catch(error){
            console.error(error);
            categoryStatus.textContent="No se pudo guardar. Comprueba los permisos de Firestore.";
        }
    });
    drawCategoryDraft();

    document.getElementById("config-save").addEventListener("click",async()=>{
        const key=document.getElementById("config-key").value.trim();
        const value=document.getElementById("config-value").value.trim();
        const status=document.getElementById("config-status");

        if(!key||!value){
            status.textContent="Completa ambos campos.";
            return;
        }

        try{
            await legacyCollection("configuracion").doc(key).set({
                value,
                updatedAt:firebase.firestore.FieldValue.serverTimestamp()
            });
            status.textContent="Configuración guardada.";
            loadConfig();
        }catch(error){
            console.error(error);
            status.textContent="No se pudo guardar. Revisa las reglas de Firestore.";
        }
    });
}

async function loadConfig(){
    const list=document.getElementById("config-list");

    if(!list)return;

    try{
        const snapshot=await legacyCollection("configuracion").get();

        if(!document.getElementById("config-list"))return;

        list.innerHTML="";

        if(snapshot.empty){
            list.textContent="No hay opciones guardadas.";
            return;
        }

        snapshot.forEach(doc=>{
            if(doc.id.startsWith("__"))return;
            const row=document.createElement("div");
            row.className="admin-record";

            const label=document.createElement("span");
            label.textContent=doc.id+": "+(doc.data().value||"");

            const remove=document.createElement("button");
            remove.textContent="ELIMINAR";

            remove.addEventListener("click",async()=>{
                if(!confirm("¿Eliminar esta configuración?"))return;

                try{
                    await legacyCollection("configuracion").doc(doc.id).delete();
                    loadConfig();

                }catch(error){
                    console.error(error);
                    alert("No se pudo eliminar.");
                }
            });

            row.append(label,remove);
            list.appendChild(row);
        });

    }catch(error){
        console.error(error);
        list.textContent="No se pudo cargar la configuración. Revisa las reglas de Firestore.";
    }
}

/* INICIO */

initializePage();

}
</script>
