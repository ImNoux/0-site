<!-- Evita mostrar el fondo global mientras se resuelve una ruta directa. -->
<script>
(function(){
  var parts=location.pathname.split('/').filter(Boolean);
  if(parts.length===1 && !/^(story|index\.html?|favicon\.png)$/i.test(parts[0])){
    document.documentElement.classList.add('route-appearance-pending');

})();
</script>

(function(){

        {
            primary:"https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js",
            fallback:"https://cdn.jsdelivr.net/npm/firebase@10.14.1/compat/firebase-app.js",
            check:()=>window.firebase&&typeof firebase.initializeApp==="function"
        },
        {
            primary:"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js",
            fallback:"https://cdn.jsdelivr.net/npm/firebase@10.14.1/compat/firebase-auth.js",
            check:()=>window.firebase&&typeof firebase.auth==="function"
        },
        {
            primary:"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js",
            fallback:"https://cdn.jsdelivr.net/npm/firebase@10.14.1/compat/firebase-firestore.js",
            check:()=>window.firebase&&typeof firebase.firestore==="function"
        }
    ];

    function loadScript(url){
        return new Promise((resolve,reject)=>{
            const script=document.createElement("script");
            let finished=false;

            const timeout=setTimeout(()=>{
                if(finished)return;
                finished=true;
                script.remove();
                reject(new Error("Tiempo de espera agotado: "+url));
            },15000);

            script.src=url;
            script.onload=()=>{
                if(finished)return;
                finished=true;
                clearTimeout(timeout);
                resolve();
            };
            script.onerror=()=>{
                if(finished)return;
                finished=true;
                clearTimeout(timeout);
                script.remove();
                reject(new Error("No se pudo cargar: "+url));
            };

            document.head.appendChild(script);
        });
    }

    async function loadLibrary(source){
        try{
            await loadScript(source.primary);
            if(source.check())return;
            throw new Error("La librería principal no quedó disponible.");
        }catch(primaryError){
            await loadScript(source.fallback);
            if(!source.check()){
                throw new Error("La librería alternativa tampoco quedó disponible.");
            }
        }
    }

    async function loadAll(){
        for(const source of sources){
            await loadLibrary(source);
        }

        if(!window.firebase)throw new Error("Firebase no está disponible.");
        startSite();
    }

    loadAll().catch(error=>{
        console.error("Error cargando Firebase:",error);
        const message=document.createElement("div");
        message.style.cssText="position:fixed;z-index:9999;bottom:12px;left:12px;right:12px;padding:15px;background:#180909;border:1px solid #633;color:#ddd;font:12px monospace;line-height:1.7";
        message.textContent="No se pudieron cargar las librerías de Firebase. Comprueba tu conexión o si el navegador bloquea los servidores de Firebase.";
        document.body.appendChild(message);
    });
})();

/* Adaptador de compatibilidad: la interfaz antigua trabaja con nombres menu/category,
   pero toda la persistencia se realiza en las colecciones nuevas posts y categories. */
const LEGACY_SECTIONS={INICIO:"Home",HOME:"Home",BLOG:"Blog",STATUS:"Status",ABOUT:"About",SHA:"Home",SEC:"Blog",OBL:"About",ARC:"Blog"};
function normalizeSection(value){
    const raw=String(value||"").trim();
    return LEGACY_SECTIONS[raw.toUpperCase()]||raw||"Blog";
}
function categorySlug(value){return routeSlug(String(value||""));}
function legacyFromPost(id,data,kind){
    const section=data.section||data.menu||"Blog";
    const category=data.categoryName||data.category||"";
    let body=data.content||data.bodyHtml||"";
    if(kind==="archivos"&&data.url&&!body){
        const label=data.linkLabel||"Abrir archivo";
        body=data.description||"";
        if(isImageUrl(data.url))body+=(body?"":"")+`<p><a href="${String(data.url).replace(/&/g,"&amp;").replace(/\"/g,"&quot;")}"><img src="${String(data.url).replace(/&/g,"&amp;").replace(/\"/g,"&quot;")}" alt="${String(data.title||"Imagen").replace(/\"/g,"&quot;")}"></a></p>`;
        else body+=`<p><a href="${String(data.url).replace(/&/g,"&amp;").replace(/\"/g,"&quot;")}">${label}</a></p>`;
    }
    if(data.imageUrl&&!/<img\b/i.test(body))body+=`<p><img src="${String(data.imageUrl).replace(/&/g,"&amp;").replace(/\"/g,"&quot;")}" alt="Imagen"></p>`;
    return {...data,id,menu:String(section).toUpperCase(),category,title:data.title||data.name||"",bodyHtml:body,
        url:data.url||data.linkUrl||data.imageUrl||"",linkLabel:data.linkLabel||"Abrir archivo",
        createdAt:data.createdAt,updatedAt:data.updatedAt};
}
function legacyToPost(kind,data){
    const out={...data};
    if(Object.prototype.hasOwnProperty.call(data,"menu"))out.section=normalizeSection(data.menu);
    if(Object.prototype.hasOwnProperty.call(data,"category")){
        out.categoryName=data.category;
        out.categoryId=categorySlug(data.category);
    }
    if(kind==="publicaciones"){
        if(Object.prototype.hasOwnProperty.call(data,"bodyHtml"))out.content=data.bodyHtml;
        out.slug=categorySlug(data.title)||("post-"+Date.now());
        out.published=data.published!==false;
        out.kind="publication";
    }else if(kind==="archivos"){
        out.kind="file";
        out.published=false;
        out.content=data.description||data.content||"";
        out.linkUrl=data.url||"";
        if(isImageUrl(data.url||""))out.imageUrl=data.url;
    }
    delete out.bodyHtml;
    return out;
}
function legacyCollection(name){
    const target=name==="publicaciones"||name==="archivos"?"posts":"categories";
    const kind=name;
    const filters=[];
    const matches=(doc)=>{
        const d=doc.data();
        if(kind==="publicaciones"&&d.kind==="file")return false;
        if(kind==="archivos"&&d.kind!=="file")return false;
        if(kind==="configuracion"&&doc.id!=="__categorias"&&!String(doc.id).startsWith("__setting__"))return false;
        for(const [field,value] of filters){
            let actual=d[field];
            if(field==="menu")actual=String(d.section||d.menu||"").toUpperCase();
            if(field==="category")actual=d.categoryName||d.category||"";
            if(actual!==value)return false;
        }
        return true;
    };
    const mapDoc=doc=>({id:kind==="configuracion"&&doc.id.startsWith("__setting__")?doc.id.replace(/^__setting__/,""):doc.id,data:()=>{
        const raw=doc.data();
        if(kind==="publicaciones"||kind==="archivos")return legacyFromPost(doc.id,raw,kind);
        if(kind==="configuracion"){
            if(doc.id==="__categorias")return raw;
            return {...raw,_configKey:doc.id.replace(/^__setting__/,"")};
        }
        return raw;
    }});
    const makeSnapshot=snap=>{
        const docs=snap.docs.filter(matches).map(mapDoc);
        return {docs,empty:docs.length===0,size:docs.length,forEach(fn){docs.forEach(fn)}};
    };
    const wrapDoc=id=>{
        const ref=firestore.collection(target).doc(kind==="configuracion"&&id!=="__categorias"?"__setting__"+id:id);
        return {
            get:async()=>{const snap=await ref.get();return {id:snap.id,exists:snap.exists,data:()=>{
                const raw=snap.data()||{};
                return kind==="configuracion"&&id!=="__categorias"?{...raw,_configKey:id}:raw;
            }};},
            update:async value=>ref.update(legacyToPost(kind,value)),
            set:async value=>ref.set(kind==="configuracion"?value:legacyToPost(kind,value)),
            delete:()=>ref.delete(),
            _ref:ref
        };
    };
    function buildFirestoreQuery(){
        let firestoreQuery=firestore.collection(target);

        /* Firestore Rules no filtra documentos: la consulta pública debe
           limitarse en el servidor a publicaciones publicadas del tipo correcto. */
        if(kind==="publicaciones"||kind==="archivos"){
            firestoreQuery=firestoreQuery.where(
                "kind","==",kind==="publicaciones"?"publication":"file"
            );

            const isAdmin=currentUser&&currentUser.uid===ADMIN_UID;
            if(!isAdmin){
                firestoreQuery=firestoreQuery.where("published","==",true);
            }
        }

        return firestoreQuery;
    }
    const query={
        where(field,op,value){if(op!=="==")throw new Error("Solo se admite igualdad en este adaptador.");filters.push([field,value]);return query;},
        get:async()=>makeSnapshot(await buildFirestoreQuery().get()),
        onSnapshot:(next,error)=>buildFirestoreQuery().onSnapshot(snap=>next(makeSnapshot(snap)),error)
    };
    return {
        where:query.where,get:query.get,onSnapshot:query.onSnapshot,
        doc:wrapDoc,
        add:async value=>firestore.collection(target).add(legacyToPost(kind,value))
    };
}

function cloneSectionSettings(){
    const copy={};
    Object.keys(sections).forEach(key=>{
        copy[key]=sections[key].map(item=>({...item,hidden:Boolean(item.hidden)}));
    });
    return copy;
}
function applySectionSettings(value){
    if(!value||typeof value!=="object")return;
    Object.keys(sections).forEach(key=>{
        if(!Array.isArray(value[key]))return;
        const clean=value[key].filter(item=>
            item&&typeof item.title==="string"&&item.title.trim()&&
            !["Entrada","Logs","Relatos","Anomalías","Límites","Reflejos","dump","Señales","Sector 0","Punto ciego","Frecuencias","Buffer","Fragmentos","Espejos","Rutas caducadas"].includes(item.title.trim())
        ).map(item=>({
                title:item.title.trim().slice(0,60),
                description:typeof item.description==="string"?item.description.slice(0,240):"",
                hidden:Boolean(item.hidden)
            }));
        if(clean.length)sections[key].splice(0,sections[key].length,...clean);
    });
}

function getSaved(key){
    try{
        const value=localStorage.getItem(key);
        if(value!==null)return value;
    }catch(e){}
    try{
        const safeKey=key.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
        const match=document.cookie.match(new RegExp("(?:^|; )"+safeKey+"=([^;]*)"));
        return match?decodeURIComponent(match[1]):null;
    }catch(e){return null}
}
function saveData(key,value){
    try{localStorage.setItem(key,value)}catch(e){}
    try{
        document.cookie=key+"="+encodeURIComponent(value)+"; Max-Age=31536000; Path=/; SameSite=Lax; Secure";
    }catch(e){}
}

/* ORDEN PERSONALIZADO */

function hasCustomOrder(item){
    return typeof item.order==="number"&&Number.isFinite(item.order);
}

function compareRecords(a,b){
    if(hasCustomOrder(a)&&hasCustomOrder(b)){
        return a.order-b.order;
    }

    const ta=a.createdAt?.toMillis?.()||0;
    const tb=b.createdAt?.toMillis?.()||0;
    return tb-ta;
}

function sortRecords(items){
    return [...items].sort(compareRecords);
}

async function prepareNextOrder(collectionName,menu,category,excludeId=null){
    const snapshot=await legacyCollection(collectionName)
        .where("menu","==",menu)
        .get();

    const records=[];

    snapshot.forEach(doc=>{
        if(doc.id===excludeId)return;

        const data=doc.data();

        if(data.category===category){
            records.push({id:doc.id,...data});
        }
    });

    const ordered=sortRecords(records);
    if(ordered.length){
        await Promise.all(ordered.map((item,index)=>
            legacyCollection(collectionName).doc(item.id).update({order:index})
        ));
    }
    return ordered.length;
}

async function moveRecord(collectionName,records,index,direction,reloadFunction){
    const ordered=sortRecords(records);
    const newIndex=index+direction;

    if(newIndex<0||newIndex>=ordered.length)return;

    const first=ordered[index];
    const second=ordered[newIndex];

    if(first.menu!==second.menu||first.category!==second.category)return;

    [ordered[index],ordered[newIndex]]=[ordered[newIndex],ordered[index]];

    try{
        await Promise.all(ordered.map((item,position)=>
            legacyCollection(collectionName).doc(item.id).update({order:position})
        ));
        await reloadFunction();
    }catch(error){
        console.error("Error cambiando el orden:",error);
        alert("No se pudo guardar el nuevo orden. Comprueba tu conexión e inténtalo de nuevo.");
    }
}

async function loadCategorySettings(){
    try{
        const categoryDefaults=Object.entries(sections).filter(([menu])=>menu!=="INICIO").flatMap(([menu,items])=>items.map(item=>({
            id:categorySlug(item.title),name:item.title,slug:categorySlug(item.title),section:normalizeSection(menu),published:!item.hidden,description:item.description||""
        })));
        const existing=await firestore.collection("categories").get();
        const existingIds=new Set(existing.docs.map(doc=>doc.id));
        const seedBatch=firestore.batch();
        let seedCount=0;
        categoryDefaults.forEach(category=>{
            if(!existingIds.has(category.id)){
                seedBatch.set(firestore.collection("categories").doc(category.id),{name:category.name,slug:category.slug,section:category.section,published:category.published,description:category.description,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
                seedCount++;
            }
        });
        if(seedCount)await seedBatch.commit();
        const doc=await legacyCollection("configuracion").doc("__categorias").get();
        if(doc.exists&&doc.data()?.sections){
            applySectionSettings(doc.data().sections);
            buildPublicMenus();
        }
    }catch(error){
        console.warn("Se mantienen las categorías predeterminadas:",error);
    }
}

/* Precarga únicamente la apariencia de STATUS mientras se visita la portada.
   Reutiliza la misma clave local que applyRouteAppearance para que la ruta
   pueda pintar el fondo sin esperar una segunda consulta a Firestore. */
let statusAppearancePreloadPromise=null;
function preloadStatusAppearance(){
    if(statusAppearancePreloadPromise)return statusAppearancePreloadPromise;
    statusAppearancePreloadPromise=(async()=>{
        const cacheKey="0site_route_appearance_status";
        let cachedAppearance=null;
        try{
            const cached=localStorage.getItem(cacheKey);
            if(cached)cachedAppearance=JSON.parse(cached);
        }catch(error){console.warn("No se pudo leer la apariencia precargada de STATUS:",error);}

        const preloadImage=async url=>{
            if(typeof url!=="string"||!/^https:\/\//i.test(url.trim()))return;
            const image=new Image();
            image.decoding="async";
            image.src=url.trim();
            if(typeof image.decode==="function"){
                try{await image.decode();}catch(error){}
            }
        };

        if(cachedAppearance?.backgroundImage)preloadImage(cachedAppearance.backgroundImage);

        try{
            const snap=await firestore.collection("categories").doc("status").get();
            if(!snap.exists)return cachedAppearance;
            const latest=snap.data()?.appearance;
            if(!latest||typeof latest!=="object")return cachedAppearance;
            try{localStorage.setItem(cacheKey,JSON.stringify(latest));}catch(error){}
            if(latest.backgroundImage)await preloadImage(latest.backgroundImage);
            return latest;
        }catch(error){
            console.warn("No se pudo precargar la apariencia de STATUS:",error);
            return cachedAppearance;
        }
    })();
    return statusAppearancePreloadPromise;
}
if(location.pathname==="/"||/\/index\.html?$/i.test(location.pathname))preloadStatusAppearance();

/* INTERCEPTAR CLICS EN ENLACES INTERNOS DENTRO DEL CONTENIDO */
document.getElementById("content-area").addEventListener("click",event=>{
    const anchor=event.target.closest("a");
    if(!anchor)return;

    const rawHref=anchor.getAttribute("href")||"";
    if(!rawHref)return;

    let url;
    try{
        url=new URL(rawHref,location.origin);
    }catch(e){
        return;
    }

    const sameSiteHost=url.hostname.replace(/^www\./i,"")===location.hostname.replace(/^www\./i,"");
    if(sameSiteHost&&(url.pathname==="/"||url.pathname==="/index.html")){
        event.preventDefault();
        showInicio();
        window.scrollTo({top:0,behavior:"smooth"});
        return;
    }

    if(url.origin===location.origin){
        const parts=url.pathname.split("/").filter(Boolean).map(p=>{try{return decodeURIComponent(p)}catch(e){return p}});
        if(parts[0]==="story"&&parts[1]){
            event.preventDefault();
            const letter=document.getElementById("letter-screen");
            const home=document.getElementById("home-screen");
            if(letter){letter.style.display="none";letter.style.opacity="0";}
            if(home){home.style.display="block";home.style.opacity="1";}
            saveData("siteEntered","yes");
            openRelatoBySlug(routeSlug(parts.slice(1).join("/")),true);
            window.scrollTo({top:0,behavior:"smooth"});
            return;
        }
        if(parts.length===1){
            const slug=routeSlug(parts[0]);
            const allCategories=Object.entries(sections).flatMap(([section,items])=>items.map(item=>({section,item})));
            const match=allCategories.find(({item})=>routeSlug(item.title)===slug);
            if(match){
                event.preventDefault();
                showCategory(match.section,match.item.title,match.item.description,true);
                window.scrollTo({top:0,behavior:"smooth"});
                return;
            }
        }
        if(parts.length>=2){
            const sec=parts[0].toUpperCase();
            if(sections[sec]){
                const wanted=routeSlug(parts.slice(1).join("/"));
                const cat=sections[sec].find(item=>routeSlug(item.title)===wanted);
                if(cat){
                    event.preventDefault();
                    showCategory(sec,cat.title,cat.description,true);
                    window.scrollTo({top:0,behavior:"smooth"});
                    return;
                }
            }
        }
    }
});


/* CONTENIDO HTML SEGURO */

function validHexColor(value){
    return typeof value==="string"&&/^#[0-9a-fA-F]{6}$/.test(value);
}

function safeInlineFontFamily(value){
    const allowed=["Arial","Verdana","Tahoma","Trebuchet MS","Georgia","Times New Roman","Garamond","Courier New"];
    if(typeof value!=="string")return "";
    return allowed.includes(value.replace(/["']/g,"").trim())?value.replace(/["']/g,"").trim():"";
}
function safeInlineFontSize(value){
    if(typeof value!=="string")return "";
    const match=value.match(/^([8-9]|[1-6][0-9]|7[0-2])px$/);
    return match?match[0]:"";
}
function safeInlineColor(value){
    if(typeof value!=="string")return "";
    if(/^#[0-9a-fA-F]{6}$/.test(value))return value;

    const rgb=value.match(/^rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/i);
    if(!rgb)return "";

    const channels=rgb.slice(1).map(Number);
    if(channels.some(channel=>channel<0||channel>255))return "";
    return `rgb(${channels.join(",")})`;
}

function safeHtml(html){
    const parser=new DOMParser();
    const doc=parser.parseFromString(String(html||""),"text/html");
    const allowed=["P","DIV","BR","B","STRONG","I","EM","U","A","SPAN","UL","OL","LI","IMG"];

    function clean(parent){
        [...parent.childNodes].forEach(node=>{
            if(node.nodeType===Node.TEXT_NODE)return;

            if(node.nodeType!==Node.ELEMENT_NODE){
                node.remove();
                return;
            }

            if(!allowed.includes(node.tagName)){
                const children=[...node.childNodes];
                node.replaceWith(...children);

                children.forEach(child=>{
                    if(child.nodeType===Node.ELEMENT_NODE)clean(child);
                });

                return;
            }

            if(node.tagName==="IMG"){
                const rawSrc=node.getAttribute("src")||"";
                let imageUrl;

                try{
                    imageUrl=new URL(rawSrc,location.href);
                }catch(e){
                    node.remove();
                    return;
                }

                if(!["http:","https:"].includes(imageUrl.protocol)){
                    node.remove();
                    return;
                }

                const alt=node.getAttribute("alt")||"Imagen";
                const rawWidth=node.style.width||node.getAttribute("width")||"auto";
                const safeWidth=/^(?:auto|(?:[1-9]\d?|100)%)$/.test(String(rawWidth).trim())
                    ?String(rawWidth).trim():"auto";
                const rawAlign=node.getAttribute("data-align")||"left";
                const safeAlign=["left","center","right"].includes(rawAlign)?rawAlign:"left";

                [...node.attributes].forEach(attr=>node.removeAttribute(attr.name));

                node.setAttribute("src",imageUrl.href);
                node.setAttribute("data-align",safeAlign);
                node.setAttribute("alt",alt.slice(0,200));
                node.setAttribute("loading","lazy");
                node.setAttribute("referrerpolicy","no-referrer");
                node.style.width=safeWidth;
                node.style.maxWidth="100%";
                node.style.height="auto";
                node.style.setProperty("margin-left",safeAlign==="right"?"auto":(safeAlign==="center"?"auto":"0"),"important");
                node.style.setProperty("margin-right",safeAlign==="left"?"auto":(safeAlign==="center"?"auto":"0"),"important");

                return;
            }

            const savedColor=(node.tagName==="A"||node.tagName==="SPAN")?(node.style.color||""):"";
            const savedFontFamily=node.tagName==="SPAN"?(node.style.fontFamily||""):"";
            const savedFontSize=node.tagName==="SPAN"?(node.style.fontSize||""):"";

            [...node.attributes].forEach(attr=>{
                const name=attr.name.toLowerCase();
                const keepLinkAttribute=node.tagName==="A"&&["href","target","rel"].includes(name);
                const keepSafeStyle=(node.tagName==="A"||node.tagName==="SPAN")&&name==="style";
                if(!keepLinkAttribute&&!keepSafeStyle)node.removeAttribute(attr.name);
            });

            node.removeAttribute("style");
            const safeColor=safeInlineColor(savedColor);
            const safeFamily=safeInlineFontFamily(savedFontFamily);
            const safeSize=safeInlineFontSize(savedFontSize);
            if(safeColor)node.style.color=safeColor;
            if(node.tagName==="SPAN"&&safeFamily)node.style.fontFamily=safeFamily;
            if(node.tagName==="SPAN"&&safeSize)node.style.fontSize=safeSize;

            if(node.tagName==="A"){
                try{
                    const rawHref=(node.getAttribute("href")||"").trim();
                    const url=new URL(rawHref,location.origin);

                    if(!["http:","https:","mailto:"].includes(url.protocol)){
                        const children=[...node.childNodes];
                        node.replaceWith(...children);

                        children.forEach(child=>{
                            if(child.nodeType===Node.ELEMENT_NODE)clean(child);
                        });

                        return;
                    }

                    if(url.origin===location.origin){
                        node.setAttribute("href",url.pathname+url.search+url.hash);
                        node.removeAttribute("target");
                        node.removeAttribute("rel");
                    }else{
                        node.setAttribute("href",url.href);
                        node.setAttribute("target","_blank");
                        node.setAttribute("rel","noopener noreferrer");
                    }

                }catch(e){
                    const children=[...node.childNodes];
                    node.replaceWith(...children);

                    children.forEach(child=>{
                        if(child.nodeType===Node.ELEMENT_NODE)clean(child);
                    });

                    return;
                }
            }

            clean(node);
        });
    }

    clean(doc.body);
    return doc.body.innerHTML;
}

/* APARIENCIA INDEPENDIENTE POR RUTA */
function resetRouteAppearance(){
    const root=document.documentElement;
    root.style.removeProperty("--route-background-image");
    root.style.removeProperty("--route-background-color");
    const content=document.getElementById("content-area");
    if(!content)return;
    content.style.background="";
    content.style.border="";
    content.style.backdropFilter="";
    content.style.webkitBackdropFilter="";
    content.style.borderRadius="";
    content.style.boxShadow="";
}
async function applyRouteAppearance(section,title,token){
    const root=document.documentElement;
    const slug=categorySlug(title);
    const cacheKey="0site_route_appearance_"+slug;
    root.classList.add("route-appearance-pending");
    resetRouteAppearance();

    function paintAppearance(appearance){
        if(!appearance||typeof appearance!=="object")return;
        if(typeof appearance.backgroundImage==="string"&&/^https:\/\//i.test(appearance.backgroundImage.trim())){
            const safeUrl=appearance.backgroundImage.trim().replace(/["\\\n\r]/g,"");
            root.style.setProperty("--route-background-image",`url("${safeUrl}")`);
        }
        if(validHexColor(appearance.backgroundColor))root.style.setProperty("--route-background-color",appearance.backgroundColor);
        const content=document.getElementById("content-area");
        if(!content)return;
        const panelColor=validHexColor(appearance.panelColor)?appearance.panelColor:"#2d2d2d";
        const opacity=Math.max(0,Math.min(1,Number(appearance.panelOpacity??0.58)));
        const match=panelColor.match(/^#([0-9a-f]{6})$/i);
        if(match){
            const value=parseInt(match[1],16);
            const r=(value>>16)&255,g=(value>>8)&255,b=value&255;
            content.style.background=`rgba(${r},${g},${b},${opacity})`;
        }
        const borderWidth=Math.max(0,Math.min(12,Number(appearance.borderWidth??0)));
        if(borderWidth>0&&validHexColor(appearance.borderColor))content.style.border=`${borderWidth}px solid ${appearance.borderColor}`;
        const blur=Math.max(0,Math.min(30,Number(appearance.blur??0)));
        if(blur){content.style.backdropFilter=`blur(${blur}px)`;content.style.webkitBackdropFilter=`blur(${blur}px)`;}
        const radius=Math.max(0,Math.min(40,Number(appearance.panelRadius??0)));
        if(radius)content.style.borderRadius=`${radius}px`;
        if(validHexColor(appearance.shadowColor))content.style.boxShadow=`0 12px 35px ${appearance.shadowColor}`;
    }

    function releaseBackground(){
        if(token===currentContentToken)root.classList.remove("route-appearance-pending");
    }

    if(!slug){releaseBackground();return;}

    // Primero aplica la última apariencia guardada en este navegador.
    // Muy importante: quitar la clase de espera enseguida permite que el navegador
    // empiece a descargar la imagen, sin esperar la respuesta de Firestore.
    let hasCache=false;
    try{
        const cached=localStorage.getItem(cacheKey);
        if(cached){
            paintAppearance(JSON.parse(cached));
            hasCache=true;
            releaseBackground();
        }
    }catch(error){console.warn("No se pudo leer la apariencia guardada localmente:",error);}

    // Actualiza Firebase en segundo plano cuando ya existe una copia local.
    // En una primera visita (sin caché), espera a Firebase para conocer la URL.
    const refresh=async()=>{
        try{
            const snap=await firestore.collection("categories").doc(slug).get();
            if(token!==currentContentToken)return;
            if(!snap.exists){
                try{localStorage.removeItem(cacheKey);}catch(error){}
                if(!hasCache)releaseBackground();
                return;
            }
            const appearance=snap.data()?.appearance;
            if(appearance&&typeof appearance==="object"){
                paintAppearance(appearance);
                try{localStorage.setItem(cacheKey,JSON.stringify(appearance));}catch(error){}
            }else{
                try{localStorage.removeItem(cacheKey);}catch(error){}
            }
        }catch(error){
            console.warn("No se pudo cargar la apariencia de esta ruta:",error);
        }finally{
            if(!hasCache)releaseBackground();
        }
    };

    if(hasCache){ refresh(); return; }
    await refresh();
}

/* Recupera el color aplicado a cada fragmento del título STATUS desde el editor. */
function statusTitlePartColor(item, part){
    if(!item?.titleHtml)return "";
    const holder=document.createElement("div");
    holder.innerHTML=safeHtml(item.titleHtml);
    const fullText=holder.textContent||"";
    const splitAt=fullText.search(/\s/);
    if(splitAt<0)return part==="author"?"":"";
    const start=part==="author"?0:splitAt+1;
    const end=part==="author"?splitAt:fullText.length;
    const walker=document.createTreeWalker(holder,NodeFilter.SHOW_TEXT);
    let offset=0,node;
    while((node=walker.nextNode())){
        const nodeStart=offset,nodeEnd=offset+node.nodeValue.length;
        offset=nodeEnd;
        if(nodeEnd<=start||nodeStart>=end)continue;
        let parent=node.parentElement;
        while(parent&&parent!==holder){
            const color=safeInlineColor(parent.style?.color||"");
            if(color)return color;
            parent=parent.parentElement;
        }
    }
    return "";
}

/* STATUS: fecha relativa y metadatos */
function statusRelativeTime(item, initialText=""){
    // Si el título incluye "hace N días", N es el punto de partida y aumenta cada día.
    const initialMatch=String(initialText).trim().match(/^hace\s+(\d+)\s+d[ií]as?$/i);
    if(initialMatch){
        let publishedAt=null;
        if(item.createdAt){
            if(typeof item.createdAt.toDate==="function")publishedAt=item.createdAt.toDate();
            else if(item.createdAt instanceof Date)publishedAt=item.createdAt;
            else if(typeof item.createdAt.seconds==="number")publishedAt=new Date(item.createdAt.seconds*1000);
        }
        if(!publishedAt&&item.statusDate){
            const parts=String(item.statusDate).split("-").map(Number);
            if(parts.length===3&&parts.every(Number.isFinite))publishedAt=new Date(parts[0],parts[1]-1,parts[2]);
        }
        const elapsed=publishedAt&&!Number.isNaN(publishedAt.getTime())?Math.max(0,Math.floor((Date.now()-publishedAt.getTime())/86400000)):0;
        const totalDays=Number(initialMatch[1])+elapsed;
        if(totalDays>=365){const years=Math.floor(totalDays/365);return `hace ${years} ${years===1?"año":"años"}`;}
        return `hace ${totalDays} ${totalDays===1?"día":"días"}`;
    }
    if(item.statusTimeText&&String(item.statusTimeText).trim())return String(item.statusTimeText).trim();
    let date=null;
    // Prioriza la fecha real de creación/publicación para el tiempo automático.
    if(item.createdAt){
        if(typeof item.createdAt.toDate==="function")date=item.createdAt.toDate();
        else if(item.createdAt instanceof Date)date=item.createdAt;
        else if(typeof item.createdAt.seconds==="number")date=new Date(item.createdAt.seconds*1000);
    }
    // La fecha elegida manualmente queda como respaldo si no existe createdAt.
    if(!date&&item.statusDate){
        const parts=String(item.statusDate).split("-").map(Number);
        if(parts.length===3&&parts.every(Number.isFinite))date=new Date(parts[0],parts[1]-1,parts[2]);
    }
    if(!date||Number.isNaN(date.getTime()))return "recién publicado";
    const seconds=Math.max(0,Math.floor((Date.now()-date.getTime())/1000));
    if(seconds<60)return "hace un momento";
    const minutes=Math.floor(seconds/60);if(minutes<60)return `hace ${minutes} ${minutes===1?"minuto":"minutos"}`;
    const hours=Math.floor(minutes/60);if(hours<24)return `hace ${hours} ${hours===1?"hora":"horas"}`;
    const days=Math.floor(hours/24);if(days<30)return `hace ${days} ${days===1?"día":"días"}`;
    const months=Math.floor(days/30);if(months<12)return `hace ${months} ${months===1?"mes":"meses"}`;
    const years=Math.floor(days/365);return `hace ${years} ${years===1?"año":"años"}`;
}

/* MOSTRAR CATEGORÍAS */

async function showCategory(section,title,description,updateUrl=false){
    closeMenus();
    if(updateUrl)changePublicUrl(categoryPath(section,title));

    saveData("siteCategory",JSON.stringify({
        section,title,description
    }));

    clearContentListeners();
    const content=document.getElementById("content-area");
    const token=++currentContentToken;

    content.innerHTML="";
    const appearanceTask=applyRouteAppearance(section,title,token);
    if(token!==currentContentToken)return;

    const showHeader = section==="INICIO";

    if(showHeader){
        const desc=document.createElement("p");
        desc.className="content-description";
        desc.textContent=description;
        if(section!=="INICIO"){
            const heading=document.createElement("h2");
            heading.className="content-title";
            heading.textContent=title;
            content.append(heading,desc);
        }else{
            content.appendChild(desc);
        }
    }



    const loading=document.createElement("p");
    loading.className="admin-status";
    loading.textContent="Consultando registros...";
    content.appendChild(loading);

    try{
        clearContentListeners();

        function renderContent(pubDocs, fileDocs){
            if(token!==currentContentToken)return;
            const existingPubs = content.querySelectorAll(".publication:not([data-static])");
            existingPubs.forEach(el => el.remove());
            content.querySelectorAll(".status-first-divider").forEach(el=>el.remove());
            const existingLoading = content.querySelector(".admin-status");
            if(existingLoading) existingLoading.remove();

            const orderedPublications=sortRecords(pubDocs.filter(item=>item.published!==false));
            orderedPublications.forEach((item,publicationIndex)=>{
                const article=document.createElement("article");
                article.className="publication publication-font-modern";
                if(section==="BLOG"&&title==="Stories")article.dataset.storySlug=routeSlug(item.title);
                const isStatusPublication=section==="STATUS"&&categorySlug(title)==="status";
                // En STATUS, el encabezado completo se escribe directamente en TÍTULO.
                // La primera publicación no muestra encabezado; desde la segunda sí.
                if(item.title&&(!isStatusPublication||publicationIndex>0)){
                    if(isStatusPublication){
                        const heading=document.createElement("div");
                        heading.className="status-heading";
                        const rawTitle=String(item.title).trim();
                        const splitAt=rawTitle.search(/\s/);
                        const authorText=splitAt<0?rawTitle:rawTitle.slice(0,splitAt);
                        const timeText=splitAt<0?statusRelativeTime(item):statusRelativeTime(item,rawTitle.slice(splitAt+1).trim());
                        const author=document.createElement("span");
                        author.className="status-author";
                        author.textContent=authorText;
                        const authorColor=statusTitlePartColor(item,"author");
                        if(authorColor)author.style.color=authorColor;
                        heading.appendChild(author);
                        if(timeText){
                            const time=document.createElement("span");
                            time.className="status-time";
                            time.textContent=timeText;
                            const timeColor=statusTitlePartColor(item,"time");
                            if(timeColor)time.style.color=timeColor;
                            heading.appendChild(time);
                        }
                        const titleFont=safeInlineFontFamily(item.titleFontFamily||"");
                        const titleSize=safeInlineFontSize(item.titleFontSize||"");
                        if(titleFont)heading.style.fontFamily=titleFont;
                        if(titleSize)heading.style.fontSize=titleSize;
                        article.appendChild(heading);
                    }else{
                        const h=document.createElement("h3");
                        if(item.titleHtml)h.innerHTML=safeHtml(item.titleHtml);
                        else h.textContent=item.title;
                        if(validHexColor(item.titleColor))h.style.color=item.titleColor;
                        const titleFont=safeInlineFontFamily(item.titleFontFamily||"");
                        const titleSize=safeInlineFontSize(item.titleFontSize||"");
                        if(titleFont)h.style.fontFamily=titleFont;
                        if(titleSize)h.style.fontSize=titleSize;
                        if(section==="BLOG"&&title==="Stories"){
                            h.style.cursor="pointer";
                            h.title="Abrir historia";
                            h.addEventListener("click",()=>openRelato(item,true,orderedPublications));
                        }
                        article.appendChild(h);
                    }
                }
                const body=document.createElement("div");
                body.className="publication-body";
                body.innerHTML=safeHtml(item.bodyHtml||"");
                const bodyFont=safeInlineFontFamily(item.bodyFontFamily||"");
                const bodySize=safeInlineFontSize(item.bodyFontSize||"");
                if(bodyFont)body.style.fontFamily=bodyFont;
                if(bodySize)body.style.fontSize=bodySize;
                if(validHexColor(item.bodyColor))body.style.color=item.bodyColor;
                body.querySelectorAll("p, div").forEach(node=>{
                    const hasContent=node.querySelector("img, a, ul, ol, video, iframe");
                    if(!node.textContent.trim()&&!hasContent)node.remove();
                });
                body.querySelectorAll("br + br").forEach(br=>br.remove());
                if(section==="BLOG"&&title==="Stories"){
                    article.appendChild(body);
                    content.appendChild(article);
                    const lineHeight=parseFloat(getComputedStyle(body).lineHeight)||20;
                    const lineCount=Math.ceil(body.scrollHeight/lineHeight);
                    if(lineCount>=6){
                        body.classList.add("relato-preview-body");
                        const readMore=document.createElement("button");
                        readMore.type="button";
                        readMore.className="read-more-button";
                        readMore.textContent="Seguir leyendo";
                        readMore.addEventListener("click",()=>openRelato(item,true,orderedPublications));
                        article.appendChild(readMore);
                    }
                }else{
                    article.appendChild(body);
                    content.appendChild(article);
                }
                if(section==="STATUS"&&categorySlug(title)==="status"&&publicationIndex===0&&orderedPublications.length>1){
                    const separator=document.createElement("hr");
                    separator.className="status-first-divider";
                    content.appendChild(separator);
                }
            });

            const orderedFiles=sortRecords(fileDocs);
            orderedFiles.forEach(item=>{
                const article=document.createElement("article");
                article.className="publication";
                const h=document.createElement("h3");
                h.textContent=item.title||"Archivo";
                const p=document.createElement("p");
                p.className="publication-body";
                p.textContent=item.description||"";
                article.append(h,p);
                if(isImageUrl(item.url||"")){
                    const img=document.createElement("img");
                    img.className="file-image";
                    img.src=item.url;
                    img.alt=item.title||"Imagen";
                    img.loading="lazy";
                    img.referrerPolicy="no-referrer";
                    img.onerror=()=>{
                        img.remove();
                        const a=document.createElement("a");
                        a.href=item.url;
                        a.target="_blank";
                        a.rel="noopener noreferrer";
                        a.textContent=item.linkLabel||"Abrir archivo";
                        article.appendChild(a);
                    };
                    article.appendChild(img);
                }else{
                    const a=document.createElement("a");
                    a.href=item.url||"#";
                    a.target="_blank";
                    a.rel="noopener noreferrer";
                    a.textContent=item.linkLabel||"Abrir archivo";
                    article.appendChild(a);
                }
                content.appendChild(article);
            });

            if(!pubDocs.length&&!fileDocs.length){
                const empty=document.createElement("p");
                empty.className="admin-status";
                empty.textContent="No hay publicaciones en esta sección.";
                content.appendChild(empty);
            }
        }

        const pubQuery = legacyCollection("publicaciones").where("menu","==",section).where("category","==",title);
        const unsubPub = pubQuery.onSnapshot(snapshot=>{
            const docs=[];
            snapshot.forEach(doc=>docs.push({id:doc.id,...doc.data()}));
            renderContent(docs, window._currentFiles||[]);
        }, err=>console.error(err));
        activeContentListeners.push(unsubPub);

        const fileQuery = legacyCollection("archivos").where("menu","==",section).where("category","==",title);
        const unsubFile = fileQuery.onSnapshot(snapshot=>{
            const files=[];
            snapshot.forEach(doc=>files.push({id:doc.id,...doc.data()}));
            window._currentFiles=files;
            pubQuery.get().then(snap=>{
                const docs=[];
                snap.forEach(doc=>docs.push({id:doc.id,...doc.data()}));
                renderContent(docs, files);
            });
        }, err=>console.error(err));
        activeContentListeners.push(unsubFile);

        Promise.all([pubQuery.get(), fileQuery.get()]).then(([pSnap, fSnap])=>{
            const docs=[], files=[];
            pSnap.forEach(doc=>docs.push({id:doc.id,...doc.data()}));
            fSnap.forEach(doc=>files.push({id:doc.id,...doc.data()}));
            window._currentFiles=files;
            renderContent(docs, files);
        });

        return;

    }catch(error){
        console.error("Error cargando contenido:",error);

        if(token===currentContentToken){
            loading.textContent="No se pudo cargar el contenido. Comprueba las reglas de Firestore.";
        }
    }
}

/* RELATOS: cada historia tiene una dirección propia y se abre como página, no como ventana flotante. */
function renderRelatoDetail(item,updateUrl=false,relatoList=[]){
    closeMenus();
    if(updateUrl)changePublicUrl("/story/"+(item.slug||routeSlug(item.title)));
    clearContentListeners();
    const content=document.getElementById("content-area");
    ++currentContentToken;
    content.innerHTML="";
    const heading=document.createElement("h2");
    heading.className="content-title";
    heading.textContent=item.title||"Relato";
    const article=document.createElement("article");
    article.className="publication publication-font-modern";
    const body=document.createElement("div");
    body.className="publication-body relato-detail-body";
    body.innerHTML=safeHtml(item.bodyHtml||"");
    const bodyFont=safeInlineFontFamily(item.bodyFontFamily||"");
    const bodySize=safeInlineFontSize(item.bodyFontSize||"");
    if(bodyFont)body.style.fontFamily=bodyFont;
    if(bodySize)body.style.fontSize=bodySize;
    if(validHexColor(item.bodyColor))body.style.color=item.bodyColor;
    article.appendChild(body);
    content.append(heading,article);

    const ordered=sortRecords(relatoList);
    const currentIndex=ordered.findIndex(record=>record.id===item.id);
    if(currentIndex>=0){
        const nav=document.createElement("nav");
        nav.className="relato-navigation";
        nav.setAttribute("aria-label","Navegación entre relatos");
        const previous=document.createElement("button");
        previous.type="button";
        previous.className="relato-nav-button";
        previous.textContent="‹ Anterior";
        previous.hidden=currentIndex===0;
        previous.addEventListener("click",()=>openRelato(ordered[currentIndex-1],true,ordered));
        const next=document.createElement("button");
        next.type="button";
        next.className="relato-nav-button";
        next.textContent="Siguiente ›";
        next.hidden=currentIndex===ordered.length-1;
        next.addEventListener("click",()=>openRelato(ordered[currentIndex+1],true,ordered));
        nav.append(previous,next);
        content.appendChild(nav);
    }
    saveData("siteEntered","yes");
}

async function openRelatoBySlug(slug,updateUrl=false){
    document.documentElement.classList.remove("route-appearance-pending");
    const content=document.getElementById("content-area");
    const token=++currentContentToken;
    clearContentListeners();
    content.innerHTML='<p class="admin-status">Recuperando relato...</p>';
    try{
        const snapshot=await legacyCollection("publicaciones")
            .where("menu","==","BLOG").where("category","==","Stories").get();
        const relatos=[];
        snapshot.forEach(doc=>relatos.push({id:doc.id,...doc.data()}));
        const ordered=sortRecords(relatos);
        const found=ordered.find(item=>(item.slug||routeSlug(item.title))===slug||routeSlug(item.title)===slug);
        if(token!==currentContentToken)return;
        if(found)renderRelatoDetail(found,updateUrl,ordered);
        else{
            content.innerHTML="";
            const message=document.createElement("p");
            message.className="admin-status";
            message.textContent="Este relato no está disponible.";
            content.appendChild(message);
        }
    }catch(error){
        if(token!==currentContentToken)return;
        content.innerHTML="";
        const message=document.createElement("p");
        message.className="admin-status";
        message.textContent="No se pudo recuperar este relato.";
        content.appendChild(message);
        console.error("Error cargando relato:",error);
    }
}

function openRelato(item,updateUrl=false,relatoList=null){
    if(!item||!item.title)return;
    if(Array.isArray(relatoList)){
        renderRelatoDetail(item,updateUrl,relatoList);
        window.scrollTo({top:0,behavior:"smooth"});
        return;
    }
    openRelatoBySlug(item.slug||routeSlug(item.title),updateUrl);
    window.scrollTo({top:0,behavior:"smooth"});
}

function renderRouteFromPath(allowStoryFallback=true){
    const parts=location.pathname.split("/").filter(Boolean).map(part=>{try{return decodeURIComponent(part)}catch(e){return part}});
    if(!parts.length|| (parts.length===1&&["index.html","index.htm"].includes(parts[0].toLowerCase())))return false;
    const slug=routeSlug(parts.join("/"));
    if(parts[0]==="story"&&parts[1]){
        const letter=document.getElementById("letter-screen");
        const home=document.getElementById("home-screen");
        if(letter){letter.style.display="none";letter.style.opacity="0";}
        if(home){home.style.display="block";home.style.opacity="1";}
        saveData("siteEntered","yes");
        openRelatoBySlug(routeSlug(parts.slice(1).join("/")),false);
        return true;
    }
    const allCategories=Object.entries(sections).flatMap(([section,items])=>items.map(item=>({section,item})));

    // URL pública corta (funciona tanto para categorías visibles como ocultas): /2nd-round, /los-red-room, etc.
    if(parts.length===1){
        const direct=allCategories.find(({item})=>routeSlug(item.title)===slug);
        if(direct){
            const letter=document.getElementById("letter-screen");
            const home=document.getElementById("home-screen");
            if(letter){letter.style.display="none";letter.style.opacity="0";}
            if(home){home.style.display="block";home.style.opacity="1";}
            saveData("siteEntered","yes");
            showCategory(direct.section,direct.item.title,direct.item.description,false);
            return true;
        }
    }

    // Las historias de BLOG/Stories usan una ruta propia: /nombre-del-relato
    // En la primera pasada no asumir que una ruta desconocida es una historia:
    // las categorías personalizadas pueden estar cargándose desde Firebase.
    if(allowStoryFallback&&parts.length===1&&slug!=="index-html"){
        openRelatoBySlug(slug,false);
        const letter=document.getElementById("letter-screen");
        const home=document.getElementById("home-screen");
        if(letter){letter.style.display="none";letter.style.opacity="0";}
        if(home){home.style.display="block";home.style.opacity="1";}
        saveData("siteEntered","yes");
        return true;
    }

}

function restoreCategory(){
    const content=document.getElementById("content-area");
    const saved=getSaved("siteCategory");

    if(!saved){
        showInicio();
        return;
    }

    try{
        const data=JSON.parse(saved);

        if(data.section==="INICIO"){
            showInicio();
            return;
        }

        const valid=sections[data.section]?.find(item=>item.title===data.title);

        if(valid)showCategory(data.section,valid.title,valid.description);
        else showInicio();

    }catch(e){
        content.innerHTML="";
    }
}

/* CARTA DE ENTRADA */

function typeWriter(){
    if(typingStarted)return;

    typingStarted=true;

    const message=messages[Math.floor(Math.random()*messages.length)];
    const textElement=document.getElementById("typed-text");
    const cursor=document.getElementById("cursor");
    const signatureElement=document.getElementById("letter-signature");
    let index=0;

    function type(){
        if(index<message.length){
            const character=message.charAt(index);

            textElement.textContent+=character;
            index++;

            setTimeout(type,character==="\n"?350:32);

        }else{
            cursor.style.display="none";
            if(signatureElement)signatureElement.classList.add("show");
            setTimeout(showHomeScreen,2500);
        }
    }

    type();
}

function showHomeScreen(){
    if(transitionStarted)return;

    transitionStarted=true;

    const letter=document.getElementById("letter-screen");
    const home=document.getElementById("home-screen");

    letter.style.opacity="0";

    setTimeout(()=>{
        letter.style.display="none";
        home.style.display="block";

        setTimeout(()=>home.style.opacity="1",100);

        saveData("siteEntered","yes");
        showInicio();

    },1500);
}

async function initializePage(){
    typingStarted=false;
    const letter=document.getElementById("letter-screen");
    const home=document.getElementById("home-screen");

    // Si ya entró antes, ocultar la carta inmediatamente, sin esperar a Firebase.
    if(getSaved("siteEntered")==="yes"){
        if(letter){letter.style.display="none";letter.style.opacity="0";}
        if(home){home.style.display="block";home.style.opacity="1";}
        transitionStarted=true;
        // Resolver primero las rutas conocidas sin esperar a la carga de toda la configuración.
        // Así la apariencia personalizada empieza a consultarse inmediatamente.
        if(renderRouteFromPath(false))return;
        await categorySettingsPromise;
        // Después de cargar la configuración, resolver también las categorías nuevas/ocultas.
        if(renderRouteFromPath(true))return;
        showInicio();
        return;
    }

    // Guardar la primera visita y resolver rutas directas antes de mostrar la carta.
    saveData("siteEntered","yes");
    if(renderRouteFromPath())return;

    // Mostrar la carta inmediatamente: no esperar a que Firebase termine de cargar.
    transitionStarted=false;
    if(letter){letter.style.display="flex";letter.style.opacity="1";}
    if(home){home.style.display="none";home.style.opacity="0";}
    typeWriter();

    // La configuración puede terminar de cargar mientras se escribe la carta.
    await categorySettingsPromise;
}

/* LOGIN ADMINISTRADOR */

document.getElementById("admin-login-button").addEventListener("click",async()=>{
    const rememberedEmail=localStorage.getItem(ADMIN_EMAIL_KEY)||"";
    const email=rememberedEmail||document.getElementById("admin-email").value.trim();
    const password=document.getElementById("admin-password").value;
    const status=document.getElementById("admin-login-status");
    const button=document.getElementById("admin-login-button");

    if((!email&&!rememberedEmail)||!password){
        status.textContent=rememberedEmail?"Introduce la contraseña.":"Introduce correo y contraseña.";
        return;
    }

    button.disabled=true;
    status.textContent="Verificando acceso...";

    try{
        await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        const credential=await auth.signInWithEmailAndPassword(email,password);

        if(credential.user.uid!==ADMIN_UID){
            await auth.signOut();
            status.textContent="Acceso denegado.";
            return;
        }

        localStorage.setItem(ADMIN_EMAIL_KEY,email);
        sessionStorage.setItem("0site_admin_panel_open","1");
        syncAdminEmailField();

        document.getElementById("admin-login").style.display="none";
        document.getElementById("admin-dashboard").style.display="block";

        localStorage.setItem("0site_admin_tab","contenido");
        renderAdminTab("contenido");

    }catch(error){
        console.error(error);
        status.textContent="No se pudo iniciar sesión. Revisa tus datos.";

    }finally{
        button.disabled=false;
    }
});

document.querySelectorAll(".admin-tab").forEach(button=>{
    button.addEventListener("click",()=>{
        document.querySelectorAll(".admin-tab").forEach(b=>b.classList.remove("active"));

        button.classList.add("active");
        editingId=null;
        localStorage.setItem("0site_admin_tab",button.dataset.adminTab);

        renderAdminTab(button.dataset.adminTab);
    });
});

/* SELECTORES DE MENÚ Y CATEGORÍA (INCLUYE CATEGORÍAS OCULTAS PARA QUE EL ADMIN PUBLIQUE EN ELLAS) */

function menuOptions(selected="HOME"){
    return Object.keys(sections).map(key=>
        `<option value="${key}" ${key===selected?"selected":""}>${key}</option>`
    ).join("");
}

function categoryOptions(menu,selected=""){
    return sections[menu]
        .map(item=>{
            const suffix=item.hidden?" [OCULTA]":"";
            return `<option value="${item.title}" ${item.title===selected?"selected":""}>${item.title}${suffix}</option>`;
        }).join("");
}

function fillCategorySelect(menuSelect,categorySelect,selected=""){
    categorySelect.innerHTML=categoryOptions(menuSelect.value,selected);
}

function addLocationSelectors(menuValue="HOME",categoryValue="Entrada"){
    return `
    <label class="admin-status">MENÚ DONDE SE PUBLICARÁ</label>
    <select class="admin-select" id="record-menu">${menuOptions(menuValue)}</select>

    <label class="admin-status">CATEGORÍA</label>
    <select class="admin-select" id="record-category">${categoryOptions(menuValue,categoryValue)}</select>`;
}

function setupPublicationEditor(titleEditor,bodyEditor,editData=null){

    function forceWhiteOnPaste(editor){
        editor.addEventListener("paste", e=>{
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData("text/plain");
            document.execCommand("insertText", false, text);
            const sel = window.getSelection();
            if(sel && sel.rangeCount){
                const range = sel.getRangeAt(0);
                const span = document.createElement("span");
                span.style.color = "#dedede";
                try{
                    range.surroundContents(span);
                }catch(err){
                    editor.style.color = "#dedede";
                }
            }
            editor.style.color = "#dedede";
        });
    }
    forceWhiteOnPaste(titleEditor);
    forceWhiteOnPaste(bodyEditor);

    let activeEditor=titleEditor;
    let selectedEditorImage=null;
    const savedRanges=new Map([[titleEditor,null],[bodyEditor,null]]);
    const fontPicker=document.getElementById("editor-font-family");
    const sizePicker=document.getElementById("editor-font-size");
    const colorPicker=document.getElementById("editor-text-color");
    const imageSizePicker=document.getElementById("editor-image-size");

    function rememberSelection(editor=activeEditor){
        const selection=window.getSelection();
        if(!selection||!selection.rangeCount)return;
        const range=selection.getRangeAt(0);
        if(editor.contains(range.commonAncestorContainer)){
            savedRanges.set(editor,range.cloneRange());
        }
    }
    function restoreSelection(editor=activeEditor){
        const range=savedRanges.get(editor);
        editor.focus();
        if(!range)return false;
        try{
            const selection=window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            return true;
        }catch(error){return false;}
    }

    [titleEditor,bodyEditor].forEach(editor=>{
        editor.addEventListener("focus",()=>{activeEditor=editor;});
        editor.addEventListener("keyup",()=>rememberSelection(editor));
        editor.addEventListener("mouseup",()=>rememberSelection(editor));
        editor.addEventListener("touchend",()=>setTimeout(()=>rememberSelection(editor),50));
        editor.addEventListener("selectionchange",()=>rememberSelection(editor));
        editor.addEventListener("click",event=>{
            activeEditor=editor;
            const image=event.target?.closest?.("img");
            if(image&&editor.contains(image))selectedEditorImage=image;
        });
        editor.addEventListener("touchend",event=>{
            activeEditor=editor;
            const image=event.target?.closest?.("img");
            if(image&&editor.contains(image))selectedEditorImage=image;
        },{passive:true});
    });
    document.addEventListener("selectionchange",()=>{
        [titleEditor,bodyEditor].forEach(editor=>rememberSelection(editor));
    });

    function applyInlineStyle(property,value){
        const editor=activeEditor;
        restoreSelection(editor);
        const selection=window.getSelection();
        const range=selection&&selection.rangeCount?selection.getRangeAt(0):null;
        if(range&&!range.collapsed&&editor.contains(range.commonAncestorContainer)){
            const span=document.createElement("span");
            span.style[property]=value;
            try{
                span.appendChild(range.extractContents());
                range.insertNode(span);
                if(property==="color"){
                    const linkedNodes=[];
                    const parentLink=span.closest("a");
                    if(parentLink)linkedNodes.push(parentLink);
                    span.querySelectorAll("a").forEach(link=>linkedNodes.push(link));
                    linkedNodes.forEach(link=>{link.style.color=value;});
                }
                const next=document.createRange();next.selectNodeContents(span);
                selection.removeAllRanges();selection.addRange(next);
                savedRanges.set(editor,next.cloneRange());
            }catch(error){console.error("No se pudo aplicar el formato",error);}
        }else{
            editor.style[property]=value;
            if(property==="color"&&editor===titleEditor){
                const titleColor=document.getElementById("record-title-color");
                if(titleColor&&/^#[0-9a-f]{6}$/i.test(value))titleColor.value=value;
            }
        }
    }

    document.querySelectorAll("[data-command]").forEach(button=>{
        button.addEventListener("mousedown",event=>event.preventDefault());
        button.addEventListener("click",()=>{
            restoreSelection(activeEditor);
            document.execCommand(button.dataset.command,false,null);
            rememberSelection(activeEditor);
        });
    });
    fontPicker.addEventListener("change",()=>applyInlineStyle("fontFamily",fontPicker.value));
    sizePicker.addEventListener("change",()=>applyInlineStyle("fontSize",sizePicker.value+"px"));
    colorPicker.addEventListener("input",()=>applyInlineStyle("color",colorPicker.value));

    imageSizePicker.addEventListener("change",event=>{
        if(!selectedEditorImage||!selectedEditorImage.isConnected||!([titleEditor,bodyEditor].some(editor=>editor.contains(selectedEditorImage)))){
            selectedEditorImage=null;
            alert("Toca primero la imagen que quieres cambiar y después selecciona su tamaño.");
            return;
        }
        selectedEditorImage.style.width=event.target.value;
        selectedEditorImage.style.maxWidth="100%";
        selectedEditorImage.style.height="auto";
    });
    function alignSelectedImage(alignment){
        if(!selectedEditorImage||!selectedEditorImage.isConnected||!([titleEditor,bodyEditor].some(editor=>editor.contains(selectedEditorImage)))){
            alert("Toca primero la imagen que quieres alinear.");return;
        }
        selectedEditorImage.dataset.align=alignment;
        selectedEditorImage.style.display="block";
        selectedEditorImage.style.setProperty("margin-left",alignment==="right"?"auto":(alignment==="center"?"auto":"0"),"important");
        selectedEditorImage.style.setProperty("margin-right",alignment==="left"?"auto":(alignment==="center"?"auto":"0"),"important");
    }
    document.getElementById("image-align-left").addEventListener("click",()=>alignSelectedImage("left"));
    document.getElementById("image-align-center").addEventListener("click",()=>alignSelectedImage("center"));
    document.getElementById("image-align-right").addEventListener("click",()=>alignSelectedImage("right"));

    const insertButton=document.getElementById("insert-link");
    function handleInsertLink(event){
        event.preventDefault();
        event.stopPropagation();
        const editor=activeEditor;
        if(selectedEditorImage&&selectedEditorImage.isConnected&&editor.contains(selectedEditorImage)){
            const rawImageLink=prompt("Introduce la URL que se abrirá al tocar esta imagen (https://... o /ruta)");
            if(!rawImageLink)return;
            let imageUrl;
            try{imageUrl=new URL(rawImageLink.trim(),location.origin);}catch(e){alert("La dirección no es válida.");return;}
            if(!["http:","https:"].includes(imageUrl.protocol)){alert("Solo se permiten enlaces http o https.");return;}
            const href=imageUrl.origin===location.origin?(imageUrl.pathname+imageUrl.search+imageUrl.hash):imageUrl.href;
            let wrapper=selectedEditorImage.closest("a");
            if(!wrapper||!editor.contains(wrapper)){wrapper=document.createElement("a");selectedEditorImage.parentNode.insertBefore(wrapper,selectedEditorImage);wrapper.appendChild(selectedEditorImage);}
            wrapper.href=href;
            if(imageUrl.origin!==location.origin){wrapper.target="_blank";wrapper.rel="noopener noreferrer";}else{wrapper.removeAttribute("target");wrapper.removeAttribute("rel");}
            rememberSelection(editor);
            return;
        }
        if(!restoreSelection(editor)){
            alert("Selecciona primero la palabra o frase que quieres enlazar.");
            return;
        }
        const selection=window.getSelection();
        if(!selection||selection.isCollapsed){
            alert("Selecciona primero una palabra o frase.");
            return;
        }
        const raw=prompt("Introduce la ruta interna (ej: /2nd-round) o URL (https://...)");
        if(!raw)return;
        const trimmed=raw.trim();
        let url;
        try{
            url=new URL(trimmed,location.origin);
        }catch(e){
            alert("La dirección no es válida.");
            return;
        }
        if(!["http:","https:","mailto:"].includes(url.protocol)){
            alert("Solo se permiten enlaces http, https, mailto o rutas internas (/ruta).");
            return;
        }
        const finalHref=url.origin===location.origin?(url.pathname+url.search+url.hash):url.href;
        document.execCommand("createLink",false,finalHref);
        editor.querySelectorAll("a").forEach(a=>{
            /* Si el texto ya tenía color, también se asigna al enlace completo
               para conservar el mismo color incluso en el subrayado. */
            const coloredChild=a.querySelector("span[style]");
            const coloredParent=a.parentElement?.closest("span[style]");
            const selectedColor=a.style.color||coloredChild?.style.color||coloredParent?.style.color||"";
            if(selectedColor&&safeInlineColor(selectedColor))a.style.color=selectedColor;
            const aHref=a.getAttribute("href")||"";
            try{
                const parsed=new URL(aHref,location.origin);
                if(parsed.origin===location.origin){
                    a.removeAttribute("target");
                    a.removeAttribute("rel");
                }else{
                    a.target="_blank";
                    a.rel="noopener noreferrer";
                }
            }catch(e){}
        });
        rememberSelection(editor);
    }
    insertButton.addEventListener("click",handleInsertLink);
    document.getElementById("remove-link").addEventListener("mousedown",event=>event.preventDefault());
    document.getElementById("remove-link").addEventListener("click",()=>{
        if(selectedEditorImage&&selectedEditorImage.isConnected&&activeEditor.contains(selectedEditorImage)){
            const linkedImage=selectedEditorImage.closest("a");
            if(linkedImage&&activeEditor.contains(linkedImage)){linkedImage.replaceWith(selectedEditorImage);}
            rememberSelection(activeEditor);return;
        }
        restoreSelection(activeEditor);document.execCommand("unlink",false,null);rememberSelection(activeEditor);
    });
    const imageButton=document.getElementById("insert-image");
    imageButton.addEventListener("mousedown",event=>event.preventDefault());
    imageButton.addEventListener("click",()=>{
        const editor=activeEditor;restoreSelection(editor);
        const raw=prompt("Pega la dirección directa de la imagen (JPG, PNG, GIF o WEBP)");
        if(!raw)return;
        let url;
        try{url=new URL(raw.trim());}catch(e){alert("La dirección no es válida.");return;}
        if(!["http:","https:"].includes(url.protocol)){alert("Solo se permiten direcciones http o https.");return;}
        if(!/\.(avif|bmp|gif|jpe?g|png|svg|webp)$/i.test(url.pathname)&&!confirm("La dirección no termina en una extensión de imagen conocida. ¿Quieres intentarlo de todas formas?"))return;
        const img=document.createElement("img");img.src=url.href;img.alt="Imagen";img.loading="lazy";img.referrerPolicy="no-referrer";
        const selection=window.getSelection();
        if(selection&&selection.rangeCount&&editor.contains(selection.anchorNode)){
            const range=selection.getRangeAt(0);range.deleteContents();range.insertNode(img);
            const space=document.createTextNode(" ");img.after(space);range.setStartAfter(space);range.collapse(true);
            selection.removeAllRanges();selection.addRange(range);
        }else editor.appendChild(img);
        selectedEditorImage=img;rememberSelection(editor);
    });

    const titleFont=safeInlineFontFamily(editData?.titleFontFamily||"");
    const titleSize=safeInlineFontSize(editData?.titleFontSize||"");
    const bodyFont=safeInlineFontFamily(editData?.bodyFontFamily||"");
    const bodySize=safeInlineFontSize(editData?.bodyFontSize||"");
    if(titleFont)titleEditor.style.fontFamily=titleFont;
    if(titleSize)titleEditor.style.fontSize=titleSize;
    if(validHexColor(editData?.titleColor))titleEditor.style.color=editData.titleColor;
    if(bodyFont)bodyEditor.style.fontFamily=bodyFont;
    if(bodySize)bodyEditor.style.fontSize=bodySize;
    if(validHexColor(editData?.bodyColor))bodyEditor.style.color=editData.bodyColor;
    fontPicker.value=titleFont||bodyFont||"Arial";
    sizePicker.value=(titleSize||bodySize||"16px").replace("px","");
    colorPicker.value=validHexColor(titleEditor.style.color)?titleEditor.style.color:(validHexColor(bodyEditor.style.color)?bodyEditor.style.color:"#c5c5c5");
}

/* PANEL ADMINISTRATIVO */

function renderAdminTab(tab){
    const panel=document.getElementById("admin-panel-content");
    if(tab==="contenido"){renderPublicationEditor();return;}
    if(tab==="gestor"){renderPublicationManager();return;}
    if(tab==="archivos"){renderFileEditor();return;}
    if(tab==="configuracion"){renderConfiguration();return;}
}

/* PUBLICACIONES */

function renderPublicationEditor(editData=null){
    const panel=document.getElementById("admin-panel-content");
    const menu=editData?.menu&&editData.menu!=="INICIO"?editData.menu:"HOME";
    const category=editData?.menu!=="INICIO"&&editData?.category?editData.category:"Entrada";
    panel.innerHTML=`
    <div class="admin-box">
        <p class="admin-subtitle">${editData?"EDITAR PUBLICACIÓN":"NUEVA PUBLICACIÓN"}</p>
        ${addLocationSelectors(menu,category)}
        ${editorToolbar()}
        <label class="admin-status" for="record-title">TÍTULO (OPCIONAL)</label>
        <div class="admin-input rich-editor title-editor" id="record-title" contenteditable="true" role="textbox" aria-label="Título" data-placeholder="" style="min-height:48px;overflow-wrap:anywhere"></div>
        <div id="publication-date-wrap">
            <label class="admin-status" for="publication-date">FECHA DE PUBLICACIÓN (OPCIONAL)</label>
            <input class="admin-input" id="publication-date" type="date" value="${editData?.statusDate||""}" aria-label="Fecha de publicación">
        </div>
        <label class="admin-status" for="rich-editor">CONTENIDO</label>
        <div class="rich-editor" id="rich-editor" contenteditable="true" role="textbox" aria-label="Contenido" spellcheck="true"></div>
        <div class="admin-actions">
            <button class="admin-button" id="record-save">${editData?"GUARDAR CAMBIOS":"PUBLICAR"}</button>
            <button class="admin-button" id="record-cancel">CANCELAR</button>
        </div>
        <p class="admin-status" id="record-status"></p>
    </div>`;

    const menuSelect=document.getElementById("record-menu");
    const categorySelect=document.getElementById("record-category");
    function updateStatusEditorFields(){
        const isStatus=menuSelect.value==="STATUS"&&categorySlug(categorySelect.value)==="status";
        document.getElementById("publication-date-wrap").style.display=isStatus?"block":"none";
        const titleLabel=document.querySelector('label[for="record-title"]');
        if(titleLabel)titleLabel.textContent=isStatus?"TÍTULO / AUTOR Y TIEMPO (OPCIONAL)":"TÍTULO (OPCIONAL)";
        titleEditorPlaceholder(isStatus);
    }
    function titleEditorPlaceholder(isStatus){
        const editor=document.getElementById("record-title");
        if(editor)editor.dataset.placeholder=isStatus?"Ejemplo: zorg. Hace 1 día":"";
    }
    menuSelect.addEventListener("change",()=>{
        fillCategorySelect(menuSelect,categorySelect);updateStatusEditorFields();
    });
    categorySelect.addEventListener("change",updateStatusEditorFields);
    updateStatusEditorFields();
    const titleEditor=document.getElementById("record-title");
    const bodyEditor=document.getElementById("rich-editor");
    titleEditor.innerHTML=editData?.titleHtml?safeHtml(editData.titleHtml):String(editData?.title||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    bodyEditor.innerHTML=safeHtml(editData?.bodyHtml||"");
    setupPublicationEditor(titleEditor,bodyEditor,editData);

    document.getElementById("record-cancel").addEventListener("click",()=>{
        if(editData){
            gestorTargetLocation={section:editData.menu&&editData.menu!=="INICIO"?editData.menu:"HOME",category:editData.menu!=="INICIO"&&editData.category?editData.category:"Entrada"};
        }
        editingId=null;
        document.querySelectorAll(".admin-tab").forEach(button=>button.classList.toggle("active",button.dataset.adminTab==="gestor"));
        localStorage.setItem("0site_admin_tab","gestor");
        renderAdminTab("gestor");
    });

    document.getElementById("record-save").addEventListener("click",async()=>{
        const title=titleEditor.innerText.trim();
        const titleHtml=safeHtml(titleEditor.innerHTML);
        const bodyHtml=safeHtml(bodyEditor.innerHTML);
        const status=document.getElementById("record-status");
        const saveButton=document.getElementById("record-save");
        const hasImage=!!bodyEditor.querySelector("img");
        const hasText=!!bodyEditor.textContent.trim();
        if(!hasText&&!hasImage){
            status.textContent="Escribe contenido o inserta una imagen antes de publicar.";return;
        }
        saveButton.disabled=true;status.textContent="Guardando publicación...";
        const newMenu=menuSelect.value;
        const newCategory=categorySelect.value;
        const sameLocation=editData&&editData.menu===newMenu&&editData.category===newCategory;
        const data={
            menu:newMenu,category:newCategory,title,titleHtml,
            statusDate:document.getElementById("publication-date")?.value||"",
            titleColor:validHexColor(titleEditor.style.color)?titleEditor.style.color:"#cccccc",
            titleFontFamily:safeInlineFontFamily(titleEditor.style.fontFamily)||"",
            titleFontSize:safeInlineFontSize(titleEditor.style.fontSize)||"",
            bodyColor:validHexColor(bodyEditor.style.color)?bodyEditor.style.color:"",
            bodyFontFamily:safeInlineFontFamily(bodyEditor.style.fontFamily)||"",
            bodyFontSize:safeInlineFontSize(bodyEditor.style.fontSize)||"",
            bodyHtml,
